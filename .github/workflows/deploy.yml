# Deploys — the only way the live site changes (docs/runbooks/release.md).
#
#   push to release/**   → the test site   (Firebase project alias "test",       GitHub environment "test")
#   push a tag v*        → the live site   (Firebase project alias "production", GitHub environment "production")
#
# Each environment needs, as variables: the VITE_FIREBASE_* web config of its project, and either
# GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_DEPLOY_SERVICE_ACCOUNT (preferred) or, as a secret,
# FIREBASE_SERVICE_ACCOUNT (a JSON key). Firestore rules go out before the site: a new site may
# write fields that only the new rules accept.
name: Deploy

on:
  push:
    branches: ['release/**']
    tags: ['v*']

permissions:
  contents: read
  id-token: write # Workload Identity Federation

concurrency:
  group: deploy-${{ github.ref_type == 'tag' && 'production' || 'test' }}
  cancel-in-progress: false

env:
  FIREBASE_TOOLS: firebase-tools@15.34.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'production' || 'test' }}
    env:
      ALIAS: ${{ github.ref_type == 'tag' && 'production' || 'test' }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build (production builds run the launch checks)
        run: npm run ${{ github.ref_type == 'tag' && 'build' || 'build:test' }}

      - name: Sign in to Google Cloud (Workload Identity Federation)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Sign in to Google Cloud (service account key)
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER == ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Firestore rules
        run: npx -y "$FIREBASE_TOOLS" deploy --only firestore:rules --project "$ALIAS" --non-interactive
      - name: Site
        run: npx -y "$FIREBASE_TOOLS" deploy --only hosting --project "$ALIAS" --non-interactive --message "${{ github.ref_name }} ${{ github.sha }}"
