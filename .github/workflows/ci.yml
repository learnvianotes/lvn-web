# Every push and pull request: lint, unit tests, a type-checked test build and the Cloud Functions build.
# "Launch readiness" builds for production too; it fails (without blocking anything) until the
# production launch checks pass — today: the operator's details in src/config.ts → LEGAL.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:test
      - run: npm ci --prefix functions
      - run: npm --prefix functions run build

  launch-readiness:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
