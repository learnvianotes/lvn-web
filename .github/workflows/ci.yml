# lvn-web CI (lvn-backend spec §16.4, ADR-0093): on every push and pull request — checks, unit and Playwright tests, the
# API contract, the container image, and whether a production build would pass its launch checks. Deploys are
# deploy.yml's, from release branches and v* tags only.
name: ci

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Every URL comes from .env (lvn-backend ADR-0022); CI uses the documented development values.
      - run: cp .env.example .env
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Lighthouse ≥ 90 on the public note page (spec §18, Phase 2 exit)
        run: pnpm lighthouse
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: lighthouse-report, path: lighthouse-report, retention-days: 7 }
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  contract:
    # Spec §17 contract tests: the client's operations still validate and compile against the API's current schema.
    # Reads lvn-backend's exported schema until @lvn/contracts is published (lvn-backend ADR-0031); a private
    # lvn-backend needs a read-only token in the LVN_BACKEND_READ_TOKEN secret.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: learnvianotes/lvn-backend
          path: .lvn-backend
          token: ${{ secrets.LVN_BACKEND_READ_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm graphql:sync && pnpm codegen
        env: { LVN_SCHEMA: .lvn-backend/contracts/graphql/schema.graphql }
      - name: The copied contracts code matches lvn-backend
        run: node scripts/contracts-sync.mjs --check
        env: { LVN_CONTRACTS: .lvn-backend/contracts }
      - run: pnpm typecheck

  image:
    # The image beta runs (Dockerfile), built as a check; deploy.yml builds and pushes the real one to GHCR (lvn-backend
    # ADR-0096).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: lvn-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_ENV=sandbox
            NEXT_PUBLIC_SITE_URL=https://beta.learnvianotes.in
            NEXT_PUBLIC_API_URL=https://beta.learnvianotes.in/graphql
          cache-from: type=gha
          cache-to: type=gha,mode=max

  launch-readiness:
    # A production build runs the launch checks (lib/launch-checks.ts): the operator's details in config/legal.ts and the
    # production Firebase project. It fails, without blocking anything, until the site is ready to go live.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Build for production
        run: |
          export NEXT_PUBLIC_APP_ENV=production NEXT_PUBLIC_SITE_URL=https://www.learnvianotes.in
          export NEXT_PUBLIC_FIREBASE_PROJECT_ID="$(jq -r .production config/firebase-projects.json)"
          pnpm build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm audit --prod --audit-level high
