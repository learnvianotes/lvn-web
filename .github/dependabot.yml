version: 2
updates:
  # Minor and patch bumps arrive as one grouped pull request a week; majors still come one by one, so each gets a look.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    ignore:
      # public/pdfjs/<version>/ serves pdf.js's run-time files to the phone app's reader too (lvn-backend ADR-0040),
      # one version at a time. pdf.js moves here and in lvn-mobile together, with a phone release; never on its own.
      - dependency-name: pdfjs-dist
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
