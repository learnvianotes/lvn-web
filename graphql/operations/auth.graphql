# Sign-in, registration and the account page (lvn-backend users subgraph, Phase 1).

fragment ViewerFields on User {
  id
  handle
  displayName
  email
  emailVerified
  registrationComplete
  verified
  verificationMethod
  globalRole
  restrictedMinor
  institutionalEmail
  institutionalEmailStatus
  institution {
    name
    verified
  }
}

fragment SessionFields on Session {
  accessToken
  accessTokenExpiresAt
  user {
    ...ViewerFields
  }
}

fragment Problems on UserError {
  field
  message
  code
}

query Viewer {
  viewer {
    ...ViewerFields
    profile {
      department
      yearOfStudy
      showOnProfile
    }
    legacyImport {
      status
      claimedAt
      counts {
        notes
        completedTopics
        markedProblems
        studyDays
        studyMinutes
      }
    }
  }
}

query SignInOptions {
  signInOptions {
    emailPassword
    google
    github
    linkedin
  }
  termsVersion
}

mutation SignUp($input: SignUpInput!) {
  signUp(input: $input) {
    session {
      ...SessionFields
    }
    userErrors {
      ...Problems
    }
  }
}

mutation SignIn($input: SignInInput!) {
  signIn(input: $input) {
    session {
      ...SessionFields
    }
    userErrors {
      ...Problems
    }
  }
}

mutation RefreshSession {
  refreshSession(input: {}) {
    session {
      ...SessionFields
    }
  }
}

mutation SignOut {
  signOut {
    ok
  }
}

mutation SignInWithGoogle($idToken: String!) {
  signInWithGoogle(input: { idToken: $idToken }) {
    session {
      ...SessionFields
    }
    userErrors {
      ...Problems
    }
  }
}

mutation OAuthExchange($input: OAuthExchangeInput!) {
  oauthExchange(input: $input) {
    session {
      ...SessionFields
    }
    userErrors {
      ...Problems
    }
  }
}

mutation CompleteRegistration($input: CompleteRegistrationInput!) {
  completeRegistration(input: $input) {
    ok
    userErrors {
      ...Problems
    }
  }
}

mutation VerifyEmail($token: String!) {
  verifyEmail(input: { token: $token }) {
    ok
    userErrors {
      ...Problems
    }
  }
}

mutation RequestPasswordReset($email: String!) {
  requestPasswordReset(input: { email: $email }) {
    ok
    userErrors {
      ...Problems
    }
  }
}

mutation ResetPassword($token: String!, $password: String!) {
  resetPassword(input: { token: $token, password: $password }) {
    ok
    userErrors {
      ...Problems
    }
  }
}

mutation SetInstitutionalEmail($email: String!) {
  setInstitutionalEmail(input: { email: $email }) {
    ok
    userErrors {
      ...Problems
    }
  }
}

mutation VerifyInstitutionalEmail($code: String!) {
  verifyInstitutionalEmail(input: { code: $code }) {
    ok
    userErrors {
      ...Problems
    }
  }
}

mutation ResendInstitutionalEmailCode {
  resendInstitutionalEmailCode {
    ok
    userErrors {
      ...Problems
    }
  }
}

mutation UpdateProfile($input: UpdateProfileInput!) {
  updateProfile(input: $input) {
    profile {
      department
      yearOfStudy
      showOnProfile
    }
    userErrors {
      ...Problems
    }
  }
}

mutation ClaimLegacyData {
  claimLegacyData {
    ok
    userErrors {
      ...Problems
    }
  }
}

mutation DeclineLegacyData {
  declineLegacyData {
    ok
    userErrors {
      ...Problems
    }
  }
}
