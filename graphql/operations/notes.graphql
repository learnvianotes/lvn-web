# Visibility, sharing and copies (P2c).

fragment ShareFields on NoteShare {
  role
  source
  createdAt
  user {
    id
    displayName
    handle
  }
}

query NoteShares($id: UUID!) {
  note(id: $id) {
    id
    visibility
    sharedWithConnections
    shares {
      ...ShareFields
    }
  }
  viewer {
    id
    globalRole
  }
}

mutation SetNoteSharedWithConnections($noteId: UUID!, $shared: Boolean!) {
  setNoteSharedWithConnections(input: { noteId: $noteId, shared: $shared }) {
    note {
      id
      visibility
      sharedWithConnections
    }
    userErrors {
      message
    }
  }
}

query SharedWithMe($first: Int, $after: String) {
  sharedWithMe(first: $first, after: $after) {
    edges {
      node {
        ...NoteListFields
        viewerAccess
        owner {
          id
          displayName
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

mutation ChangeNoteVisibility($noteId: UUID!, $visibility: Visibility!) {
  changeNoteVisibility(input: { noteId: $noteId, visibility: $visibility }) {
    note {
      ...NoteMeta
    }
    userErrors {
      ...Problems
    }
  }
}

mutation ShareNote($noteId: UUID!, $person: String!, $role: NoteShareRole!) {
  shareNote(input: { noteId: $noteId, person: $person, role: $role }) {
    note {
      ...NoteMeta
      shares {
        ...ShareFields
      }
    }
    userErrors {
      ...Problems
    }
  }
}

mutation UnshareNote($noteId: UUID!, $userId: UUID!) {
  unshareNote(input: { noteId: $noteId, userId: $userId }) {
    note {
      id
      shares {
        ...ShareFields
      }
    }
    userErrors {
      ...Problems
    }
  }
}

mutation ForkNote($noteId: UUID!) {
  forkNote(input: { noteId: $noteId }) {
    note {
      id
    }
    userErrors {
      ...Problems
    }
  }
}

mutation SetNoteForking($noteId: UUID!, $enabled: Boolean!) {
  setNoteForking(input: { noteId: $noteId, enabled: $enabled }) {
    note {
      ...NoteMeta
    }
    userErrors {
      ...Problems
    }
  }
}

# Uploads to a note (P2c-2): a picture, video, audio or PDF for its media cards.

mutation CreateNoteUpload($input: CreateUploadIntentInput!) {
  createUploadIntent(input: $input) {
    intent {
      fileId
      uploadUrl
      uploadHeaders {
        name
        value
      }
    }
    userErrors {
      ...Problems
    }
  }
}

mutation CompleteNoteUpload($fileId: UUID!) {
  completeUpload(fileId: $fileId) {
    ok
    userErrors {
      ...Problems
    }
  }
}
