# Resources (lvn-backend ADR-0074): submitting with a preview, one's own, and a resource's page.

fragment ResourceFields on Resource {
  id
  type
  title
  description
  url
  host
  isbn
  author
  coverUrl
  topics {
    id
    title
  }
  submittedBy {
    id
    displayName
    handle
  }
  status
  reason
  decidedAt
  createdAt
  viewerCan {
    edit
    delete
    report
  }
  saveCount
  viewerSaved
}

query Resource($id: UUID!) {
  resource(id: $id) {
    ...ResourceFields
  }
}

query MyResources {
  myResources {
    ...ResourceFields
  }
}

query ResourceTopicOptions($query: String!) {
  resourceTopicOptions(query: $query) {
    id
    title
    subjectTitle
  }
}

query ResourcePreview($input: ResourcePreviewInput!) {
  resourcePreview(input: $input) {
    url
    title
    description
    author
    isbn
    type
    siteName
    imageUrl
    found
    existing {
      id
      title
    }
  }
}

mutation SubmitResource($input: SubmitResourceInput!) {
  submitResource(input: $input) {
    resource {
      ...ResourceFields
    }
    userErrors {
      field
      message
      code
    }
  }
}

mutation UpdateResource($input: UpdateResourceInput!) {
  updateResource(input: $input) {
    resource {
      ...ResourceFields
    }
    userErrors {
      field
      message
      code
    }
  }
}

mutation DeleteResource($input: ResourceIdInput!) {
  deleteResource(input: $input) {
    ok
    userErrors {
      message
    }
  }
}

# Finding resources (lvn-backend ADR-0075): the catalogue, saves, recommendations.

query Resources($filter: ResourceFilter, $sort: ResourceSort, $first: Int, $after: String) {
  resources(filter: $filter, sort: $sort, first: $first, after: $after) {
    edges {
      node {
        ...ResourceFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query SavedResources($first: Int, $after: String) {
  savedResources(first: $first, after: $after) {
    edges {
      node {
        ...ResourceFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query ResourceRecommendations($to: RecommendationPlaceInput!, $first: Int, $after: String) {
  resourceRecommendations(to: $to, first: $first, after: $after) {
    edges {
      node {
        id
        reason
        createdAt
        viewerCanRemove
        from {
          id
          displayName
          handle
        }
        resource {
          ...ResourceFields
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

mutation SaveResource($input: ResourceIdInput!) {
  saveResource(input: $input) {
    resource {
      id
      saveCount
      viewerSaved
    }
    userErrors {
      message
    }
  }
}

mutation UnsaveResource($input: ResourceIdInput!) {
  unsaveResource(input: $input) {
    resource {
      id
      saveCount
      viewerSaved
    }
    userErrors {
      message
    }
  }
}

mutation RecommendResource($input: RecommendResourceInput!) {
  recommendResource(input: $input) {
    ok
    userErrors {
      field
      message
      code
    }
  }
}

mutation RemoveResourceRecommendation($input: ResourceRecommendationIdInput!) {
  removeResourceRecommendation(input: $input) {
    ok
    userErrors {
      message
    }
  }
}
