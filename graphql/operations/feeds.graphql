# Feeds (lvn-backend ADR-0049): followed people's public notes, and the activity of one's groups and classes.

query FollowingFeed($after: String) {
  followingFeed(first: 20, after: $after) {
    edges {
      node {
        id
        title
        slug
        kind
        publishedAt
        owner {
          id
          displayName
          handle
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query ActivityFeed($after: String) {
  activityFeed(first: 20, after: $after) {
    edges {
      node {
        key
        kind
        at
        actor {
          id
          displayName
          handle
        }
        group {
          id
          name
        }
        classroom {
          id
          name
        }
        post {
          id
          body
          discussion {
            commentCount
          }
        }
        announcement {
          id
          body
        }
        doubt {
          id
          title
          status
        }
        # A workspace repository's commit, pull request or issue (lvn-backend ADR-0078)
        repositoryEvent {
          id
          kind
          action
          title
          number
          authorLogin
          url
        }
        note {
          id
          title
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Community's For You and Trending (lvn-backend ADR-0076): public notes as post cards.
fragment PostCardFields on Note {
  id
  title
  slug
  kind
  visibility
  publishedAt
  excerpt
  viewerSaved
  owner {
    id
    displayName
    handle
    profile {
      department
    }
  }
  topics {
    id
    title
  }
  previewPicture {
    id
    mediumUrl
    url
  }
  discussion {
    commentCount
    reactions {
      ...ReactionsFields
    }
  }
}

query ForYouFeed($first: Int, $after: String) {
  forYouFeed(first: $first, after: $after) {
    edges {
      cursor
      node {
        ...PostCardFields
      }
      topic {
        id
        title
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    basedOn {
      id
      title
    }
  }
}

query TrendingFeed($first: Int, $after: String) {
  trendingFeed(first: $first, after: $after) {
    edges {
      cursor
      node {
        ...PostCardFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
