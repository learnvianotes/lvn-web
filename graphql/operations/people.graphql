query MyPeople($first: Int, $after: String) {
  viewer {
    id
    handle
    followerCount
    followingCount
  }
  myFollowers(first: $first, after: $after) {
    edges {
      since
      node {
        ...PersonFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
  myFollowing(first: $first) {
    edges {
      since
      node {
        ...PersonFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
  myBlocked {
    since
    node {
      ...PersonFields
    }
  }
  myRestricted {
    since
    node {
      ...PersonFields
    }
  }
}
