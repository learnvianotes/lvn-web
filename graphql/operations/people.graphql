query MyPeople($first: Int, $after: String) {
  viewer {
    id
    handle
    globalRole
    followerCount
    followingCount
  }
  myConnections {
    since
    node {
      ...PersonFields
    }
  }
  myConnectionRequests {
    id
    direction
    createdAt
    person {
      ...PersonFields
    }
  }
  myFollowers(first: $first, after: $after) {
    edges {
      since
      node {
        ...PersonFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
  myFollowing(first: $first) {
    edges {
      since
      node {
        ...PersonFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
  myBlocked {
    since
    node {
      ...PersonFields
    }
  }
  myRestricted {
    since
    node {
      ...PersonFields
    }
  }
}

mutation RequestConnection($input: PersonInput!) {
  requestConnection(input: $input) {
    user {
      id
      relation {
        ...RelationFields
      }
    }
    userErrors {
      message
    }
  }
}

mutation RespondToConnectionRequest($input: RespondToConnectionRequestInput!) {
  respondToConnectionRequest(input: $input) {
    user {
