# People (lvn-backend ADR-0043): follows, blocks, restrictions. Profiles are read on the server
# (features/people/data.ts); what the viewer may do is fetched here, in the browser.

fragment PersonFields on User {
  id
  handle
  displayName
  globalRole
  verified
}

fragment RelationFields on Relation {
  following
  followedBy
  blocked
  restricted
  connected
  pendingConnection {
    direction
    requestId
  }
  viewerCan {
    follow
    unfollow
    removeFollower
    block
    unblock
    restrict
    unrestrict
    requestConnection
    respondToConnection
    removeConnection
  }
}

query ProfileRelation($handle: String!) {
  userByHandle(handle: $handle) {
    id
    followerCount
    followingCount
    relation {
      ...RelationFields
    }
  }
  viewer {
    id
    verified
  }
}

mutation FollowUser($input: PersonInput!) {
  followUser(input: $input) {
    user {
      id
      relation {
        ...RelationFields
      }
    }
    userErrors {
      message
    }
  }
}

mutation UnfollowUser($input: PersonInput!) {
