# Search (lvn-backend §11, ADR-0055, ADR-0056): notes the viewer may read, people (never minors, never across a block),
# topics, and (signed in) groups and classes. Filters narrow notes; `after` continues the notes of the same search.

query Search($query: String!, $first: Int, $scopes: [SearchScope!], $filters: SearchFilters, $after: String) {
  search(query: $query, scopes: $scopes, first: $first, filters: $filters, after: $after) {
    notes {
      snippet
      note {
        id
        title
        kind
        visibility
        viewerAccess
        publishedAt
        owner {
          id
          displayName
        }
      }
    }
    notesCursor
    people {
      id
      handle
      displayName
      globalRole
    }
    topics {
      id
      title
      subject {
        id
        title
      }
    }
    groups {
      id
      name
      type
      privacy
      memberCount
    }
    classrooms {
      id
      name
      memberCount
    }
    resources {
      id
      type
      title
      host
      author
      saveCount
    }
  }
}
