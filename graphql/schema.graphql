}

"""
Counts for charts. from is inclusive and to is exclusive. Omit both for the last 30 days. At most 366 days.
"""
type AdminActivitySummary {
  byAction: [AdminActivityActionCount!]!
  byDay: [AdminActivityDayCount!]!
  from: DateTime!
  to: DateTime!
  total: Int!
}

"""
`from` is inclusive and `to` is exclusive, both aligned to a UTC minute. A refresh within that minute reuses the cached aggregate.
"""
type AdminAiMetrics {
  byModel: [AdminAiModelUsage!]!
  byProvider: [AdminAiProviderUsage!]!
  byTask: [AdminAiTaskUsage!]!
  completionTokens: String!
  costMicroUsd: String!
  failures: Int!
  from: DateTime!
  promptTokens: String!
  tasksRun: Int!
  to: DateTime!
}

type AdminAiModelUsage {
  completionTokens: String!
  costMicroUsd: String!
  failures: Int!
  model: String!
  promptTokens: String!
  provider: String!
  tasksRun: Int!
}

"""
Token sums and cost are decimal strings because they can exceed a GraphQL Int. Cost is millionths of a US dollar, 0 when no call recorded a price.
"""
type AdminAiProviderUsage {
  completionTokens: String!
  costMicroUsd: String!
  failures: Int!
  promptTokens: String!
  provider: String!
  tasksRun: Int!
}

type AdminAiTaskUsage {
  completionTokens: String!
  costMicroUsd: String!
  failures: Int!
  promptTokens: String!
  task: String!
  tasksRun: Int!
}

type AdminAppVersionCount {
  """
  Null: no version was sent, or it was not one (MAJOR.MINOR[.PATCH], at most 32 characters).
  """
  appVersion: String
  events: Int!

  """
  users / the platform's users, 0 to 1. Someone on two versions counts in both, so shares can add up past 1.
  """
  share: Float!

  """
  Distinct people who sent an event from this version. Always at least 5.
  """
  users: Int!
}

type AdminContentAuthor {
  email: String!
  handle: String!
  id: UUID!
}

type AdminContentConnection {
  edges: [AdminContentEdge!]!
  pageInfo: PageInfo!
}

type AdminContentCount {
  count: Int!
  type: AdminContentType!
}

type AdminContentCounts {
  counts: [AdminContentCount!]!
  from: DateTime
  to: DateTime
}

type AdminContentEdge {
