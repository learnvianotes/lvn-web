# LearnViaNotes API schema — composed from contexts/*/src/graphql/*.graphql by scripts/export-supergraph.mjs. Do not edit.
type AuthPayload {
  session: Session
  userErrors: [UserError!]!
}

"""
One block of a note (§4.1). `position` orders cards (a fractional index: compare as plain strings, then by id).
"""
type Card {
  """Shape depends on `type` (@lvn/contracts/validation CARD_CONTENT)"""
  content: JSON!
  id: UUID!
  position: String!

  """
  Send it back as baseRevision when changing or deleting the card (§13.2)
  """
  revision: Int!
  type: CardType!
}

type CardConnection {
  edges: [CardEdge!]!
  pageInfo: PageInfo!
}

type CardEdge {
  cursor: String!
  node: Card!
}

"""
A card as the client has it. Ids are UUIDs the client makes, so cards created offline keep their id.
"""
input CardInput {
  content: JSON!
  id: UUID!
  position: String!
  type: CardType!
}

input CardOpInput {
  """The card's revision the client last saw; omitted for new cards"""
  baseRevision: Int
  content: JSON
  id: UUID!
  kind: CardOpKind!
  position: String
  type: CardType
}

enum CardOpKind {
  """Remove the card; send `baseRevision`"""
  DELETE

  """Change only `position`"""
  MOVE

  """Create the card, or change it; send `baseRevision` when changing"""
  UPSERT
}

type CardOpResult {
  id: UUID!
  message: String

  """The card's revision after the save"""
  revision: Int
  status: CardOpStatus!
}

enum CardOpStatus {
  APPLIED

  """
  Applied, but the card had changed on another device since baseRevision: that version is kept in `conflictVersion`
  """
  APPLIED_WITH_CONFLICT

  """
  Not applied: the card was deleted, or changed elsewhere before this delete
  """
  REJECTED
}

"""
The sixteen card types (§4.1); content is validated per type (@lvn/contracts/validation)
"""
enum CardType {
  audio
  callout
  checklist
  code
  diagram
  file
  flashcard
  heading
  image
  markdown
  question
  quiz
  quote
  table
  text
  video
}

"""
After a provider sign-in (no signUp call): the same details, collected once
"""
input CompleteRegistrationInput {
  acceptedTermsVersion: String!
  dateOfBirth: String!
  displayName: String!
  institutionalEmail: String
}

type CoreProblemMark {
  mark: ProblemMark!
  problemId: String!
}

"""
Progress on a /core subject — the old site's history plus everything recorded since
"""
type CoreSubjectProgress {
  problems: [CoreProblemMark!]!
  subjectId: String!
  topics: [CoreTopicProgress!]!
}

"""topicKey = subjectId/topicId of the /core content"""
type CoreTopicProgress {
  completed: Boolean!
  lastStudiedAt: DateTime
  revisit: Boolean!
  secondsStudied: Int!
  topicKey: String!
}

input CreateFolderInput {
  name: String!
  parentId: UUID
}

input CreateNoteInput {
  cards: [CardInput!]
  folderId: UUID
  kind: NoteKind
  tagNames: [String!]
  title: String
  topicIds: [UUID!]
}

input CreateUploadIntentInput {
  """Shown to people; never part of the storage key"""
  fileName: String!
  mimeType: String!
  parentId: UUID
  purpose: FilePurpose!
  sizeBytes: Int!
}

scalar DateTime

input DecideDomainReviewInput {
  approve: Boolean!
  domain: String!
}

type DomainReview {
  domain: String!
  firstSeenAt: DateTime!

  """How many people asked for it"""
  requests: Int!
  status: DomainReviewStatus!
}

enum DomainReviewStatus {
  ACADEMIC_QUEUED
  APPROVED
  NEEDS_REVIEW
  REJECTED
}

"""Fixed error vocabulary (§6.2)"""
enum ErrorCode {
  CONFLICT
  FORBIDDEN
  INTERNAL
  NOT_FOUND
  RATE_LIMITED
  UNAUTHENTICATED
  VALIDATION
}

"""
What an upload is for. Phase 1 accepts AVATAR and VERIFICATION_DOCUMENT; note media arrives with notes (Phase 2).
"""
enum FilePurpose {
  ATTACHMENT
  AVATAR
  COVER
  EXPORT
  IMPORT
  VERIFICATION_DOCUMENT
  VOICE_NOTE
}

"""The viewer's folder; nested up to 5 levels"""
type Folder {
  id: UUID!
  name: String!

  """Live notes directly in this folder"""
  noteCount: Int!
  parentId: UUID
}

type FolderPayload {
  folder: Folder
  userErrors: [UserError!]!
}

enum GlobalRole {
  PLATFORM_ADMIN
  STUDENT
  TEACHER
}

input IdInput {
  id: UUID!
}

type Institution {
  name: String!
  verified: Boolean!
}

enum InstitutionalEmailStatus {
  """A code was sent to the address and not yet entered"""
  CODE_SENT

  """Confirmed; the account is verified by it"""
  CONFIRMED

  """No college or organisation email yet"""
  NONE

  """
  Confirmed, but the domain waits for platform-admin review before it verifies the account
  """
  PENDING_REVIEW
}

scalar JSON

type LegacyCounts {
  completedTopics: Int!
  markedProblems: Int!
  notes: Int!
  studyDays: Int!
  studyMinutes: Int!
}

type LegacyImport {
  claimedAt: DateTime
  counts: LegacyCounts
  status: LegacyImportStatus!
}

enum LegacyImportStatus {
  AVAILABLE
  CLAIMED
  DECLINED
  NOT_FOUND
}

"""
A plan limit and current use, for "3 of 5 groups" and early warnings; limit null = unlimited
"""
type Limit {
  key: LimitKey!
  limit: Float
  used: Float!
}

enum LimitKey {
  AI_TOKENS_DAILY
  CLASSROOMS_OWNED
  CLASSROOM_MEMBERS
  EXPORTS_DAILY
  GROUPS_OWNED
  GROUP_MEMBERS
  IMPORTS_DAILY
  ORG_SEATS
  PDF_PAGES_MONTHLY
  PROJECT_WORKSPACES
  STORAGE_BYTES
}

type Mutation {
  """Attach the old site's data to this account"""
  claimLegacyData: OkPayload!
  completeRegistration(input: CompleteRegistrationInput!): OkPayload!

  """Checks the uploaded bytes (size, magic bytes) and makes the file READY"""
  completeUpload(fileId: UUID!): OkPayload!
  createFolder(input: CreateFolderInput!): FolderPayload!
  createNote(input: CreateNoteInput!): NotePayload!
  createUploadIntent(input: CreateUploadIntentInput!): UploadIntentPayload!

  """Platform admins"""
  decideDomainReview(input: DecideDomainReviewInput!): OkPayload!

  """Decline the old site's data, or remove it after it was attached"""
  declineLegacyData: OkPayload!

  """Its notes and subfolders move up one level"""
  deleteFolder(input: IdInput!): OkPayload!

  """Move to the trash, restorable for 30 days (§4.5)"""
  deleteNote(input: NoteIdInput!): NotePayload!

  """Delete a note in the trash now, for good"""
  deleteNoteForever(input: NoteIdInput!): OkPayload!

  """Removes the tag from every note"""
  deleteTag(input: IdInput!): OkPayload!
  oauthExchange(input: OAuthExchangeInput!): AuthPayload!
  proposeTopic(input: ProposeTopicInput!): TopicPayload!

  """
  Snapshot the draft as the version readers see (owner; a verified account)
  """
  publishNote(input: NoteIdInput!): NotePayload!
  refreshSession(input: RefreshSessionInput!): AuthPayload!
  renameTag(input: RenameTagInput!): TagPayload!
  requestDocumentVerification(input: RequestDocumentVerificationInput!): VerificationRequestPayload!

  """Always ok, whether or not an account exists"""
  requestPasswordReset(input: RequestPasswordResetInput!): OkPayload!
  requestTeacherVerification(input: RequestTeacherVerificationInput!): VerificationRequestPayload!
  resendInstitutionalEmailCode: OkPayload!

  """Sets the password and signs out every device"""
  resetPassword(input: ResetPasswordInput!): OkPayload!
  restoreNote(input: NoteIdInput!): NotePayload!

  """
  Make an old version the draft again; the current draft is kept as a DRAFT version
  """
  restoreNoteVersion(input: RestoreNoteVersionInput!): NotePayload!

  """
  Teachers: requests addressed to them. Platform admins: all, including documents.
  """
  reviewVerificationRequest(input: ReviewVerificationRequestInput!): VerificationRequestPayload!

  """
  Platform admins: TEACHER is granted by review, not by an email address (§5, ADR-0017)
  """
  setGlobalRole(input: SetGlobalRoleInput!): OkPayload!

  """
  Adds or replaces the college or organisation email; a code is sent to it
  """
  setInstitutionalEmail(input: SetInstitutionalEmailInput!): OkPayload!
  signIn(input: SignInInput!): AuthPayload!
  signInWithGoogle(input: SignInWithGoogleInput!): AuthPayload!

  """Ends this device's session (its whole refresh-token family)"""
  signOut: OkPayload!
  signUp(input: SignUpInput!): AuthPayload!
  updateFolder(input: UpdateFolderInput!): FolderPayload!
  updateNoteDraft(input: UpdateNoteDraftInput!): UpdateNoteDraftPayload!
  updateProfile(input: UpdateProfileInput!): ProfilePayload!
  verifyEmail(input: VerifyEmailInput!): OkPayload!
  verifyInstitutionalEmail(input: VerifyInstitutionalEmailInput!): OkPayload!
  withdrawVerificationRequest(requestId: UUID!): OkPayload!
}

"""
A note (§4.1). Load it in two steps (§6.3): these fields and the outline first, then `cards` page by page. Editors get
the draft; readers get the published version. Notes the viewer cannot read are null, exactly as if they did not exist.
"""
type Note {
  cardCount: Int!

  """In order; at most 100 per page"""
  cards(after: String, first: Int): CardConnection!
  createdAt: DateTime!

  """Set while the note is in the trash (owner only)"""
  deletedAt: DateTime

  """Editors only: bumped by every change to the draft"""
  draftRevision: Int

  """Editors only"""
  draftUpdatedAt: DateTime

  """
  The first words of the note (at most 180 characters), for lists and previews
  """
  excerpt: String!

  """The owner's folder; null for anyone else"""
  folder: Folder
  forkingEnabled: Boolean!
  id: UUID!
  kind: NoteKind!

  """The headings, for navigation"""
  outline: [OutlineItem!]!
  owner: User!
  publishedAt: DateTime
  publishedVersion: NoteVersion

  """URL part of the title, set when published"""
  slug: String!

  """The owner's tags; empty for anyone else"""
  tags: [Tag!]!

  """Empty when untitled"""
  title: String!
  topics: [Topic!]!
  updatedAt: DateTime!

  """Editors only: one version of this note, to preview or restore"""
  version(id: UUID!): NoteVersion

  """Editors only: newest first"""
  versions(after: String, first: Int): NoteVersionConnection
  viewerAccess: NoteAccess!
  viewerCan: NotePermissions!
  visibility: Visibility!
}

"""
OWNER and EDITOR work on the draft; READER sees the published version (§4.3)
"""
enum NoteAccess {
  EDITOR
  OWNER
  READER
}

type NoteConnection {
  edges: [NoteEdge!]!
  pageInfo: PageInfo!
}

type NoteEdge {
  cursor: String!
  node: Note!
}

input NoteFilter {
  """Notes in this folder (not its subfolders)"""
  folderId: UUID
  kind: NoteKind
  tagId: UUID
  topicId: UUID

  """The trash instead of the live notes"""
  trashed: Boolean

  """Notes in no folder"""
  unfiled: Boolean
}

input NoteIdInput {
  noteId: UUID!
}

"""
What a note is presented as (ADR-0014, ADR-0015). Phase 2 creates NOTE only.
"""
enum NoteKind {
  BLOG
  NOTE
  POST
  PROJECT
}

type NotePayload {
  note: Note
  userErrors: [UserError!]!
}

"""
What the viewer may do with a note, to show or hide controls; the API checks again on every mutation.
"""
type NotePermissions {
  changeVisibility: Boolean!
  delete: Boolean!
  edit: Boolean!
  fork: Boolean!
  publish: Boolean!
  share: Boolean!
}

"""An immutable snapshot of a note's cards (§4.3)"""
type NoteVersion {
  cards(after: String, first: Int): CardConnection!
  createdAt: DateTime!
  createdBy: User!
  id: UUID!
  kind: NoteVersionKind!
  number: Int!
  title: String!
}

type NoteVersionConnection {
  edges: [NoteVersionEdge!]!
  pageInfo: PageInfo!
}

type NoteVersionEdge {
  cursor: String!
  node: NoteVersion!
}

"""
PUBLISHED: what readers see. CONFLICT: the losing side of a card edited on two devices. DRAFT: the draft before a restore.
"""
enum NoteVersionKind {
  CONFLICT
  DRAFT
  PUBLISHED
}

"""
Authorization Code + PKCE: the code from the provider's redirect and the verifier the client generated
"""
input OAuthExchangeInput {
  code: String!
  codeVerifier: String!
  provider: OAuthProvider!
  redirectUri: String!
}

"""
Providers exchanged through oauthExchange. Google uses signInWithGoogle (ADR-0007).
"""
enum OAuthProvider {
  GITHUB
  LINKEDIN
}

type OkPayload {
  ok: Boolean!
  userErrors: [UserError!]!
}

type OutlineItem {
  cardId: UUID!
  level: Int!
  text: String!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

enum ProblemMark {
  REVISIT
  SOLVED
}

type ProfilePayload {
  profile: StudentProfile
  userErrors: [UserError!]!
}

input ProposeTopicInput {
  parentId: UUID
  subjectId: UUID!
  title: String!
}

type Query {
  """
  Signed-in users: their progress on a /core subject (web reads it on /core pages)
  """
  coreProgress(subjectId: String!): CoreSubjectProgress!

  """
  Platform admins: institutional email domains waiting for review (ADR-0017)
  """
  domainReviews(status: DomainReviewStatus): [DomainReview!]!

  """Topics whose title contains the words, curated first (at most 50)"""
  findTopics(query: String!, subjectId: UUID): [Topic!]!
  myFolders: [Folder!]!

  """The viewer's own notes, most recently edited first"""
  myNotes(after: String, filter: NoteFilter, first: Int): NoteConnection!
  myTags: [Tag!]!
  myVerificationRequests: [VerificationRequest!]!

  """
  A note the viewer can read; null otherwise (anonymous visitors: PUBLIC notes)
  """
  note(id: UUID!): Note
  signInOptions: SignInOptions!
  subject(slug: String!): Subject
  subjects: [Subject!]!

  """
  Verified teachers whose name or handle matches, to ask one of them for verification
  """
  teachers(search: String!): [User!]!

  """
  Version of the Terms, Privacy Policy and public-content licence a new account accepts (§15.2)
  """
  termsVersion: String!

  """
  Platform admins only: a 15-minute link to one document; the view is written to the audit log
  """
  verificationDocumentUrl(fileId: UUID!, requestId: UUID!): SignedUrl!

  """
  Teachers: pending requests addressed to them. Platform admins: every pending request. Oldest first; `after` is the last id seen.
  """
  verificationRequestsToReview(after: UUID, first: Int): [VerificationRequest!]!

  """The signed-in user, null for anonymous visitors"""
  viewer: User
}

input RefreshSessionInput {
  """Mobile only; web sends the cookie"""
  refreshToken: String
}

input RenameTagInput {
  id: UUID!
  name: String!
}

"""
fileIds uploaded with createUploadIntent(purpose: VERIFICATION_DOCUMENT); seen by platform admins only, deleted 30 days after the decision
"""
input RequestDocumentVerificationInput {
  fileIds: [UUID!]!
  message: String
}

input RequestPasswordResetInput {
  email: String!
}

input RequestTeacherVerificationInput {
  message: String
  teacherId: UUID!
}

input ResetPasswordInput {
  password: String!
  token: String!
}

input RestoreNoteVersionInput {
  noteId: UUID!
  versionId: UUID!
}

input ReviewVerificationRequestInput {
  approve: Boolean!

  """Required when rejecting"""
  reason: String
  requestId: UUID!
}

type Session {
  """
  15-minute RS256 JWT. Web keeps it in memory; mobile in expo-secure-store.
  """
  accessToken: String!
  accessTokenExpiresAt: DateTime!

  """
  Mobile only (header X-LVN-Client: mobile). Web receives it as an HttpOnly cookie and this field is null.
  """
  refreshToken: String
  user: User!
}

input SetGlobalRoleInput {
  role: GlobalRole!
  userId: UUID!
}

input SetInstitutionalEmailInput {
  email: String!
}

input SignInInput {
  email: String!
  password: String!
}

"""Which sign-in methods this deployment offers"""
type SignInOptions {
  emailPassword: Boolean!
  github: Boolean!
  google: Boolean!
  linkedin: Boolean!
}

"""
Firebase ID token from a Google sign-in; verified by the API and exchanged for an LVN session (ADR-0007)
"""
input SignInWithGoogleInput {
  idToken: String!
}

"""
Registration (ADR-0017, ADR-0019): date of birth is required (YYYY-MM-DD). A college or organisation email is
optional; it receives a 6-digit code. `acceptedTermsVersion` must be Query.termsVersion.
"""
input SignUpInput {
  acceptedTermsVersion: String!
  dateOfBirth: String!
  displayName: String!
  email: String!
  institutionalEmail: String
  password: String!
}

type SignedUrl {
  expiresAt: DateTime!
  url: String!
}

"""
Department and year are shown to others only if showOnProfile; interests stay private
"""
type StudentProfile {
  department: String

  """
  Viewer only. Topics arrive with notes (Phase 2), which will add the resolved `interests`.
  """
  interestTopicIds: [UUID!]
  showOnProfile: Boolean!
  yearOfStudy: YearOfStudy
}

type Subject {
  id: UUID!
  slug: String!
  title: String!

  """Top-level topics: curated ones and the viewer's proposals"""
  topics: [Topic!]!
}

"""The viewer's tag; names are unique ignoring case"""
type Tag {
  id: UUID!
  name: String!
  noteCount: Int!
}

type TagPayload {
  tag: Tag
  userErrors: [UserError!]!
}

"""
A topic within a subject; curated by LVN or proposed by a user (usable by its proposer until curated)
"""
type Topic {
  children: [Topic!]!
  id: UUID!
  origin: TopicOrigin!
  parentId: UUID
  slug: String!
  subject: Subject!
  title: String!
}

enum TopicOrigin {
  CURATED
  PROPOSED
}

type TopicPayload {
  topic: Topic
  userErrors: [UserError!]!
}

scalar UUID

"""
Omitted fields stay as they are; `parentId: null` moves the folder to the top level
"""
input UpdateFolderInput {
  id: UUID!
  name: String
  parentId: UUID
}

"""
One save of the draft (autosave). Title, folder, tags and topics are last-writer-wins; card operations are checked per
card (§13.2) and reported in `results`. Omitted fields stay as they are; `folderId: null` moves the note out of folders.
"""
input UpdateNoteDraftInput {
  folderId: UUID
  noteId: UUID!
  ops: [CardOpInput!]
  tagNames: [String!]
  title: String
  topicIds: [UUID!]
}

type UpdateNoteDraftPayload {
  """
  The other device's version of conflicting cards, restorable from version history
  """
  conflictVersion: NoteVersion
  note: Note
  results: [CardOpResult!]!
  userErrors: [UserError!]!
}

"""Omitted fields stay as they are; null clears a field"""
input UpdateProfileInput {
  department: String
  interestTopicIds: [UUID!]
  showOnProfile: Boolean
  yearOfStudy: YearOfStudy
}

type UploadHeader {
  name: String!
  value: String!
}

"""
Upload the bytes with PUT to uploadUrl and exactly these headers within 10 minutes, then call completeUpload.
"""
type UploadIntent {
  expiresAt: DateTime!
  fileId: UUID!
  uploadHeaders: [UploadHeader!]!
  uploadUrl: String!
}

type UploadIntentPayload {
  intent: UploadIntent
  userErrors: [UserError!]!
}

"""A person, owned by the users subgraph; notes refer to people by id."""
type User {
  createdAt: DateTime!
  displayName: String!

  """Viewer only"""
  email: String
  emailVerified: Boolean!
  globalRole: GlobalRole!
  handle: String!
  id: UUID!

  """The confirmed college or organisation"""
  institution: Institution

  """
  Viewer only (ADR-0017): the confirmed address, or the one waiting for its code
  """
  institutionalEmail: String

  """Viewer only"""
  institutionalEmailStatus: InstitutionalEmailStatus

  """Viewer only: data from the old learnvianotes.in site (ADR-0023)"""
  legacyImport: LegacyImport

  """Viewer only"""
  limits: [Limit!]

  """The viewer's own profile; for others only when they show it"""
  profile: StudentProfile

  """False until the registration details are given (ADR-0017)"""
  registrationComplete: Boolean!

  """
  Viewer only: a minor without verified consent (§15.2) — no public publishing, no DMs
  """
  restrictedMinor: Boolean
  verificationMethod: VerificationMethod

  """
  Verified by institutional email, a teacher, or platform admins (ADR-0019)
  """
  verified: Boolean!
}

"""
An expected failure of a mutation; `field` is the dotted input path, e.g. ["input", "email"]
"""
type UserError {
  code: ErrorCode!
  field: [String!]
  message: String!
}

type VerificationDocument {
  fileId: UUID!
  fileName: String!
  mimeType: String!
  sizeBytes: Int!
}

enum VerificationMethod {
  DOCUMENTS
  INSTITUTIONAL_EMAIL
  TEACHER
}

"""
Shown to the requester, the addressed teacher and platform admins. Documents are listed for platform admins only.
"""
type VerificationRequest {
  createdAt: DateTime!
  decidedAt: DateTime

  """
  Platform admins only; open one with verificationDocumentUrl (every view is audited)
  """
  documents: [VerificationDocument!]!
  id: UUID!
  message: String
  method: VerificationMethod!
  reason: String
  requester: User!
  status: VerificationRequestStatus!

  """TEACHER method: the teacher asked to vouch"""
  teacher: User
}

type VerificationRequestPayload {
  request: VerificationRequest
  userErrors: [UserError!]!
}

enum VerificationRequestStatus {
  APPROVED
  PENDING
  REJECTED
  WITHDRAWN
}

input VerifyEmailInput {
  token: String!
}

input VerifyInstitutionalEmailInput {
  code: String!
}

"""Who can read a note (§4.2)"""
enum Visibility {
  PRIVATE
  PUBLIC
  SHARED
}

enum YearOfStudy {
  GRADUATED
  NOT_STUDYING
  POSTGRADUATE
  SCHOOL
  YEAR_1
  YEAR_2
  YEAR_3
  YEAR_4
  YEAR_5
}
