# LearnViaNotes API schema — composed from contexts/*/src/graphql/*.graphql by scripts/export-supergraph.mjs. Do not edit.
input AcceptTermsInput {
  """Query.termsVersion, as shown to the person"""
  version: String!
}

"""An account's standing, for its owner alone (ADR-0053)"""
type AccountStanding {
  """The suspension can still be appealed (once)"""
  canAppeal: Boolean!

  """
  Set while the account is suspended: nothing it does reaches other people until then
  """
  suspendedUntil: DateTime
  suspensionReason: String

  """Warnings from the last 90 days, newest first"""
  warnings: [AccountWarning!]!
}

"""A warning platform moderators gave an account (ADR-0053)"""
type AccountWarning {
  at: DateTime!
  reason: String!
}

type ActivityConnection {
  edges: [ActivityEdge!]!
  pageInfo: PageInfo!
}

type ActivityEdge {
  cursor: String!
  node: ActivityItem!
}

type ActivityItem {
  """Who posted, asked or shared"""
  actor: User

  """CLASS_ANNOUNCEMENT"""
  announcement: ClassroomPost
  at: DateTime!
  classroom: Classroom

  """DOUBT"""
  doubt: Doubt
  group: Group

  """
  Unique in the feed: a note shared to two places is two items. Deliberately not an id, so caches keep items apart
  """
  key: String!
  kind: ActivityKind!

  """SHARED_NOTE: null when the viewer can no longer read it"""
  note: Note

  """GROUP_POST and IDEA"""
  post: GroupPost
}

enum ActivityKind {
  CLASS_ANNOUNCEMENT
  DOUBT
  GROUP_POST
  IDEA
  SHARED_NOTE
}

input AddCommentInput {
  body: JSON!

  """A card of the note"""
  cardId: UUID

  """Reply to this top-level comment"""
  parentId: UUID
  target: CommentTargetInput!
}

input AddPdfHighlightInput {
  cardId: UUID

  """YELLOW when left out"""
  color: HighlightColor
  comment: String

  """A PDF attached to the note"""
  fileId: UUID!
  kind: HighlightKind!
  noteId: UUID!
  page: Int!
  quote: String

  """One rectangle for an AREA; up to 100 lines for TEXT"""
  rects: [[Float!]!]!
}

"""
The viewer's AI tokens today (UTC) against their plan's daily limit (§10.1, ADR-0024)
"""
type AiAllowance {
  """null: the plan sets no limit"""
  limitToday: Int
  resetsAt: DateTime!
  usedToday: Int!
}

"""
An Ask AI answer: the asker's own. Its text grows while it is RUNNING (live AI_ANSWER events say when)
"""
type AiAnswer {
  createdAt: DateTime!
  doubtId: UUID

  """FAILED: why, in words for the asker"""
  error: String
  id: UUID!
  noteId: UUID
  question: String!
  scope: AskAiScope!
  sources: [AiSource!]!
  status: AiArtifactStatus!

  """Markdown citing sources as [n]"""
  text: String!
}

"""
What a task made for the viewer from a note (ADR-0059). Only its maker sees it, while they can read the note
"""
type AiArtifact {
  """Card tasks, once READY: the cards to choose from"""
  cards: [AiCard!]

  """
  CLEAN_UP, once READY: the changes to choose from (empty when nothing needs mending)
  """
  changes: [AiChange!]
  createdAt: DateTime!

  """FAILED: why, in words for the person"""
  error: String

  """
  Made from the published version (the viewer is a reader) rather than the draft
  """
  fromPublishedVersion: Boolean!
  id: UUID!
  keptAt: DateTime
  language: AiLanguage!

  """Text tasks, once READY: the result as Markdown"""
  markdown: String
  note: Note!
  status: AiArtifactStatus!
  task: AiTask!

  """Card tasks, once READY: the title a new note would take"""
  title: String

  """The note was longer than a task reads; its start was used"""
  truncated: Boolean!
}

type AiArtifactPayload {
  artifact: AiArtifact
  userErrors: [UserError!]!
}

enum AiArtifactStatus {
  FAILED
  QUEUED
  READY
  RUNNING
}

"""
A card a task made, exactly as it would be kept: `type` and `content` as in the notes subgraph's Card
"""
type AiCard {
  content: JSON!
  type: String!
}

"""A card's words as CLEAN_UP would leave them (ADR-0063)"""
type AiChange {
  after: String!

  """Applied to the note with applyAiChanges"""
  applied: Boolean!

  """What the card said when the change was made"""
  before: String!
  cardId: UUID!
}

type AiConnection {
  """null: the kind's own address"""
  baseUrl: String
  chatModel: String
  embedMicroUsdPerMTok: Int!
  embedModel: String
  enabled: Boolean!

  """A key is saved; it is never shown again"""
  hasKey: Boolean!
  id: UUID!

  """
  Prices of its default models in millionths of a dollar per million tokens; the monthly budget counts them
  """
  inputMicroUsdPerMTok: Int!

  """The key's last four characters"""
  keyHint: String
  kind: AiProviderKind!
  label: String!

  """
  §10.1's data-processing flag: notes that are not public may go to it (self-hosted, or a zero-retention agreement)
  """
  mayReceivePrivate: Boolean!
  outputMicroUsdPerMTok: Int!
  updatedAt: DateTime!
}

input AiConnectionIdInput {
  id: UUID!
}

type AiConnectionPayload {
  connection: AiConnection
  userErrors: [UserError!]!
}

type AiConnectionTest {
  latencyMs: Int!

  """What happened; the provider's own words when it failed"""
  message: String!

  """Models the account lists; empty when the provider does not list them"""
  models: [String!]!
  ok: Boolean!
}

type AiConnectionTestPayload {
  test: AiConnectionTest
  userErrors: [UserError!]!
}

"""
The environment's own provider (AI_PROVIDER), which answers when no connection is chosen
"""
type AiEnvironmentProvider {
  chatModel: String
  embedModel: String

  """null: AI_PROVIDER is none"""
  kind: AiProviderKind
}

"""
A study aid made from a public note's published version: a summary, key concepts, practice questions, a quiz or flashcards
"""
type AiInsight {
  cards: [AiCard!]

  """Hidden by the owner: only they see it"""
  hidden: Boolean!
  id: UUID!

  """Text aids, once READY"""
  markdown: String
  status: AiArtifactStatus!
  task: AiTask!

  """Card aids (quiz, flashcards), once READY: the title a kept note takes"""
  title: String
  versionId: UUID!
}

enum AiLanguage {
  ENGLISH
  HINDI
  TELUGU
}

"""Who answers AI calls"""
enum AiProviderKind {
  ANTHROPIC
  GEMINI
  OLLAMA
  OPENAI

  """
  Any server that speaks OpenAI's API: a LiteLLM proxy, OpenRouter, vLLM…
  """
  OPENAI_COMPATIBLE
}

"""What a kind of provider is and can do"""
type AiProviderPreset {
  canEmbed: Boolean!

  """Takes recordings (transcription)"""
  canHear: Boolean!

  """Hints; a connection test lists what the account has"""
  chatModels: [String!]!

  """null: the connection must give an address"""
  defaultBaseUrl: String
  embedModels: [String!]!
  kind: AiProviderKind!
  name: String!
  needsKey: Boolean!

  """
  Private notes may go to it unless an admin says otherwise (a model on our own machine)
  """
  privateByDefault: Boolean!
}

type AiSettings {
  """Answers chats; null: the environment's provider"""
  chatConnectionId: UUID
  connections: [AiConnection!]!

  """
  Makes embeddings (Ask AI, meaning search); null: the environment's provider
  """
  embedConnectionId: UUID
  environment: AiEnvironmentProvider!

  """AI_KEYS_SECRET is set, so keys can be saved"""
  keysCanBeSaved: Boolean!

  """null: no monthly cap"""
  monthlyBudgetMicroUsd: Int
  presets: [AiProviderPreset!]!
  routes: [AiTaskRoute!]!
  spentThisMonthMicroUsd: Int!

  """Tasks a route can be set for"""
  tasks: [String!]!
}

type AiSettingsPayload {
  settings: AiSettings
  userErrors: [UserError!]!
}

"""A passage an answer cites, by its number in the answer ([1], [2] …)"""
type AiSource {
  cardIds: [UUID!]!
  n: Int!
  noteId: UUID!
  snippet: String!
  title: String!

  """
  The published version it came from; null for a draft (this note, asked by its owner or an editor)
  """
  versionId: UUID
}

type AiStatus {
  available: Boolean!
  reason: AiUnavailableReason
}

enum AiTask {
  """
  Mends what PDF conversion broke in the text, heading and quote cards of a note the person may edit, as changes to apply (ADR-0063)
  """
  CLEAN_UP

  """Needs the right to copy the note (ADR-0025)"""
  CREATE_NOTES

  """On the note's code cards"""
  EXPLAIN_CODE
  EXPLAIN_SIMPLY
  FIND_MISTAKES
  FLASHCARDS
  KEY_CONCEPTS

  """Needs the right to copy the note (ADR-0025)"""
  OUTLINE_TO_NOTE
  PRACTICE_QUESTIONS

  """
  The person's own note's rough words and photos, as a structured note (ADR-0062)
  """
  QUICK_NOTE
  QUIZ
  REVISION_SHEET
  SUMMARIZE

  """One audio or video card (cardIds), as a text card to keep (ADR-0062)"""
  TRANSCRIBE
  TRANSLATE
}

"""A task sent to a connection and model instead of the default"""
type AiTaskRoute {
  """null: the default connection"""
  connectionId: UUID
  inputMicroUsdPerMTok: Int!
  model: String!
  outputMicroUsdPerMTok: Int!
  task: String!
}

input AiTaskRouteInput {
  task: String!
}

"""Why AI is not answering"""
enum AiUnavailableReason {
  """This month's AI budget is used up; it resumes next month"""
  BUDGET

  """Not switched on in this environment"""
  NOT_CONFIGURED

  """The model failed several times in a row; it is tried again shortly"""
  PROVIDER_DOWN
}

