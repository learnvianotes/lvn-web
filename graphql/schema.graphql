type AdminPlatformAdoption {
  """Usage events from the platform, hidden versions included."""
  events: Int!
  platform: ClientPlatform!

  """
  Distinct people who sent a usage event from the platform. Always at least 5.
  """
  users: Int!

  """Newest version first."""
