"""A note, owned by the notes subgraph; ai adds the viewer's AI results"""
type Note {
  """
  Signed-in: the viewer's own AI results for this note, newest first; empty signed out
  """
  aiArtifacts: [AiArtifact!]!

  """
  Readers (signed in or not, while they may read the note): the READY aids the owner has not hidden. The owner: every step
  """
  aiInsights: [AiInsight!]!
  cardCount: Int!

  """In order; at most 100 per page"""
  cards(after: String, first: Int): CardConnection!

  """Owner only: the classes the note is shared to"""
  classrooms: [Classroom!]

  """
  A workspace's showcase: its team and mentors, for anyone who reads the note
  """
  contributors: [NoteContributor!]!
  createdAt: DateTime!

  """Set while the note is in the trash (owner only)"""
  deletedAt: DateTime

  """
  Signed-in readers of the note: its comments and reactions. Null for anonymous visitors
  """
  discussion: Discussion

  """Editors only: bumped by every change to the draft"""
  draftRevision: Int

  """Editors only"""
  draftUpdatedAt: DateTime

  """
  The first words of the note (at most 180 characters), for lists and previews
  """
  excerpt: String!

  """The owner's folder; null for anyone else"""
  folder: Folder

  """Set on a copy of another note; it cannot be removed"""
  forkedFrom: ForkCredit

  """Whether readers may copy this note (contracts 0.76.0). Replaces forkingEnabled on Note."""
  allowForks: Boolean!

  """How many copies of this note exist."""
  forkCount: Int!

  """Owner only: the groups the note is shared to"""
  groups: [Group!]

  """
  The owner's and editors' highlights, in page order (empty for readers); only those on one PDF with `fileId`
  """
  highlights(fileId: UUID): [PdfHighlight!]!
  id: UUID!
  kind: NoteKind!

  """Owner only; null for everyone else"""
  moderation: NoteModeration

  """
  The owner's: the aids' progress; null for anyone else, or before any. Live NOTE_PROCESSING events say when a step ends
  """
  noteProcessingStatus: NoteProcessing

  """The headings, for navigation"""
  outline: [OutlineItem!]!
  owner: User!

  """
  The latest conversion filling this note, for the person who asked for it
  """
  pdfConversion: PdfConversion

  """
  Its first picture as the viewer sees it (ADR-0076): a card's preview in Community; null without one
  """
  previewPicture: MediaFile
  publishedAt: DateTime
  publishedVersion: NoteVersion

  """
  Owner only: every connection of the owner reads it, and new connections will too (teachers, ADR-0013)
  """
  sharedWithConnections: Boolean

  """Owner only: the people the note is shared with; null for anyone else"""
  shares: [NoteShare!]

  """URL part of the title, set when published"""
  slug: String!

  """The owner's tags; empty for anyone else"""
  tags: [Tag!]!

  """Empty when untitled"""
  title: String!
  topics: [Topic!]!
  updatedAt: DateTime!

  """Editors only: one version of this note, to preview or restore"""
  version(id: UUID!): NoteVersion

  """Editors only: newest first"""
  versions(after: String, first: Int): NoteVersionConnection
  viewerAccess: NoteAccess!
  viewerCan: NotePermissions!

  """
  The viewer saved it to come back to (ADR-0076); private to them. False for visitors
  """
  viewerSaved: Boolean!

  """
  Signed in: whether the viewer studies this note's flashcards (their own notes' always count)
  """
  viewerStudying: Boolean
  visibility: Visibility!
}

