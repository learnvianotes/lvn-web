  comment: String

  """A PDF attached to the note"""
  fileId: UUID!
  kind: HighlightKind!
  noteId: UUID!
  page: Int!
  quote: String

  """One rectangle for an AREA; up to 100 lines for TEXT"""
  rects: [[Float!]!]!
}

input AddWeeklyTaskInput {
  kind: WeeklyTaskKind!

  """When and where (at most 140 characters)"""
  plan: String
  target: Int!

  """Needed for TOPIC_MINUTES; optional for QUIZ_ANSWERS"""
