input AnswerRhythmBuddyInput {
  accept: Boolean!
  id: UUID!
}

input AppealModerationInput {
  entityId: UUID!
  entityType: ReportEntityType!
  message: String!
}

input ApplyAiChangesInput {
  artifactId: UUID!

  """The cards whose changes to apply"""
