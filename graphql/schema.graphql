type Mutation {
  """Accept the current Terms, Privacy Policy and content licence"""
  acceptTerms(input: AcceptTermsInput!): OkPayload!

  """
  The signed-in person has seen the safety reminder. Later reads of safetyReminderRequired are false.
  """
  acknowledgeSafetyReminder: OkPayload!

  """
  Platform admins. CONFLICT when the email is already listed. VALIDATION when the email is not usable.
  """
  addAccessAllowlistEntry(input: AddAccessAllowlistEntryInput!): AccessAllowlistPayload!
  addComment(input: AddCommentInput!): CommentPayload!

  """
  Claims an identifier and gives the code that proves it (verified teachers)
  """
  addExternalIdentity(input: AddExternalIdentityInput!): ExternalIdentityPayload!

  """Owner and editors"""
  addPdfHighlight(input: AddPdfHighlightInput!): PdfHighlightPayload!

  """Adds a task to this week (at most three)"""
  addWeeklyTask(input: AddWeeklyTaskInput!): WeeklyTaskPayload!

  """
  Platform admins. Permanently anonymises the account, deletes its files and sessions, and keeps a hashed-email tombstone. confirm must be DELETE.
  """
  adminDeleteUser(input: AdminDeleteUserInput!): OkPayload!

  """
  Platform admins who have already passed MFA. Clears another account's unused codes and send limits, and lets that
  account sign in without a code for 2 hours. You cannot recover yourself. Audited. There is no way to edit or delete the audit row.
  """
  adminRecoverMfa(input: AdminRecoverMfaInput!): OkPayload!

  """
  Platform admins. Blocks, suspends or restores an account. Block and suspend revoke every session. Audited.
  """
  adminSetAccountStanding(input: AdminSetAccountStandingInput!): AdminUserPayload!

  """
  Platform admins. Edits name, email, age or date of birth and re-runs the age gate. A passing age clears AGE_BLOCKED. Audited.
  """
  adminUpdateUser(input: AdminUpdateUserInput!): AdminUserPayload!
  answerClassroomInvite(input: AnswerClassroomInviteInput!): ClassroomPayload!

  """Until the deadline or the submission; may change an answer"""
  answerContestQuestion(input: AnswerContestQuestionInput!): ContestPayload!

  """The team and the mentor"""
  answerDoubt(input: AnswerDoubtInput!): DoubtPayload!
  answerMentorInvite(input: AnswerMentorInviteInput!): GroupPayload!
  answerRhythmBuddy(input: AnswerRhythmBuddyInput!): OkPayload!

  """
  The author's one appeal against hiding or removing their note or content, a group's owner's against its removal, or a suspended person's against the suspension
  """
  appealModeration(input: AppealModerationInput!): OkPayload!

  """
  Applies chosen changes of a CLEAN_UP result to the note, through the normal save (ADR-0063)
  """
  applyAiChanges(input: ApplyAiChangesInput!): ApplyAiChangesPayload!

  """
  Signed in, not a teacher yet, not a child account: apply to teach (ADR-0073); a teacher applicant until reviewed
  """
  applyToTeach(input: ApplyToTeachInput!): VerificationRequestPayload!
  approveComment(input: CommentIdInput!): CommentPayload!

  """
  UNAVAILABLE when AI is off or failing; RATE_LIMITED when the day's allowance is used up
  """
  askAi(input: AskAiInput!): AskAiPayload!

  """
  Ask AI on a workspace doubt, over the notes shared with the workspace (ADR-0015)
  """
  askAiAboutDoubt(doubtId: UUID!): AskAiPayload!

  """The team"""
  askDoubt(input: AskDoubtInput!): DoubtPayload!

  """
  Ends follows both ways and stops new interaction both ways; they are not told
  """
  blockUser(input: PersonInput!): PersonPayload!

  """Keep your account: cancels a deletion you asked for"""
  cancelAccountDeletion: AccountDeletionPayload!

  """
  PRIVATE, SHARED, UNLISTED or PUBLIC (owner). Unlisted and Public need a published version. Public follows the admin setting public_notes_require_verification.
  """
  changeNoteVisibility(input: ChangeNoteVisibilityInput!): NotePayload!

  """
  Checks the proof now; once proven, its public data is imported as drafts. At most 10 checks a day
  """
  checkExternalIdentity(input: ExternalIdentityIdInput!): ExternalIdentityPayload!

  """Attach the old site's data to this account"""
  claimLegacyData: OkPayload!
  completeRegistration(input: CompleteRegistrationInput!): OkPayload!

  """Checks the uploaded bytes (size, magic bytes) and makes the file READY"""
  completeUpload(fileId: UUID!): OkPayload!

  """
  The parent clicked the confirm link. Receiving or opening the email does not call this. Sets method email_plus.
  """
  confirmGuardianConsent(token: String!): OkPayload!
  confirmNoteImport(input: NoteIdInput!): NoteImportPayload!

  """
  Confirms the person installed the GitHub App and that it covers the workspace's repository, then connects it (ADR-0078)
  """
