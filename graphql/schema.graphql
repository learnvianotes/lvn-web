# LearnViaNotes API schema — composed from contexts/*/src/graphql/*.graphql by scripts/export-supergraph.mjs. Do not edit.
input AcceptTermsInput {
  """Query.termsVersion, as shown to the person"""
  version: String!
}

"""
One email allowed to sign up and sign in while the allowlist is on. `email` is stored lowercased.
"""
type AccessAllowlistEntry {
  addedByEmail: String
  createdAt: DateTime!
  email: String!
  hasAccount: Boolean!
  id: UUID!
  note: String

  """
  Applied to the account on sign-up, and immediately when the account already exists.
  """
  role: GlobalRole!
}

type AccessAllowlistPayload {
  entry: AccessAllowlistEntry
  userErrors: [UserError!]!
}

"""
Whether sign-up and sign-in are limited to the access allowlist. Public: no sign-in required.
"""
type AccessPolicy {
  inviteOnly: Boolean!
}

type AccountDeletionPayload {
  """When the account will be deleted; null once cancelled"""
  deletionScheduledFor: DateTime
  userErrors: [UserError!]!
}

"""An account's standing, for its owner alone (ADR-0053)"""
type AccountStanding {
  """The suspension can still be appealed (once)"""
  canAppeal: Boolean!

  """
  Set while the account is suspended: nothing it does reaches other people until then
  """
  suspendedUntil: DateTime
  suspensionReason: String

  """Warnings from the last 90 days, newest first"""
  warnings: [AccountWarning!]!
}

enum AccountStatus {
  ACTIVE
  AGE_BLOCKED
  BLOCKED
  SUSPENDED
}

"""A warning platform moderators gave an account (ADR-0053)"""
type AccountWarning {
  at: DateTime!
  reason: String!
}

"""An achievement: the highest tier reached of one kind (and subject)"""
type Achievement {
  """What it says the person did"""
  description: String!
  earnedAt: DateTime!
  id: UUID!
  kind: AchievementKind!

  """For a subject contributor"""
  subjectTitle: String

  """The threshold reached: 5 topics, 12 weeks, 250 points…"""
  tier: Int!
  title: String!
}

"""What an achievement marks"""
enum AchievementKind {
  """Exams that reached their Readiness target before the day"""
  EXAM_READY

  """Topics with at least 30 quiz answers, nine in ten right"""
  QUIZ_MASTER

  """Weeks whose planned days were met"""
  RHYTHM_WEEKS

  """Points from public notes on one subject"""
  SUBJECT_CONTRIBUTOR

  """Topics recalled well and answered right (mastery ≥ 0.8)"""
  TOPICS_MASTERED
}

type AchievementSettings {
  """Only adults may show them"""
  canShow: Boolean!

  """Achievements and level shown on the viewer's profile"""
  showAchievements: Boolean!
}

type AchievementSettingsPayload {
  settings: AchievementSettings
  userErrors: [UserError!]!
}

type ActivityConnection {
  edges: [ActivityEdge!]!
  pageInfo: PageInfo!
}

type ActivityEdge {
  cursor: String!
  node: ActivityItem!
}

type ActivityItem {
  """Who posted, asked or shared; null for REPOSITORY"""
  actor: User

  """CLASS_ANNOUNCEMENT"""
  announcement: ClassroomPost
  at: DateTime!
  classroom: Classroom

  """DOUBT"""
  doubt: Doubt
  group: Group

  """
  Unique in the feed: a note shared to two places is two items. Deliberately not an id, so caches keep items apart
  """
  key: String!
  kind: ActivityKind!

  """SHARED_NOTE: null when the viewer can no longer read it"""
  note: Note

  """GROUP_POST and IDEA"""
  post: GroupPost

  """
  REPOSITORY: a commit, pull request or issue in a workspace's repository (ADR-0078)
  """
  repositoryEvent: RepositoryEvent
}

enum ActivityKind {
  CLASS_ANNOUNCEMENT
  DOUBT
  GROUP_POST
  IDEA
  REPOSITORY
  SHARED_NOTE
}

input AddAccessAllowlistEntryInput {
  email: String!
  note: String
  role: GlobalRole!
}

input AddCommentInput {
  body: JSON!

  """A card of the note"""
  cardId: UUID

  """Reply to this top-level comment"""
  parentId: UUID
  target: CommentTargetInput!
}

input AddExternalIdentityInput {
  kind: ExternalIdentityKind!

  """A GitHub user name (or its profile's address), or a page's address"""
