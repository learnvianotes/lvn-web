  """
  The public notes most reacted to and discussed in the last week, each person counted once, never the note's owner
  """
  trendingFeed(after: String, first: Int): CommunityConnection!
  unreadNotificationCount: Int!

  """
  Action ids an institution-unverified account cannot do. Empty means none. Pass these into can() on web and mobile.
  """
  unverifiedGatedActions: [String!]!

  """
  ADR-0097: whether people may upload files here. Off, clients hide every upload control and createUploadIntent answers UNAVAILABLE.
  """
  uploadsEnabled: Boolean!

  """
  A person by handle (with or without @) or by id; null when there is none, or when they have no public profile (restricted minors, ADR-0043)
  """
  userByHandle(handle: String!): User

  """
  Platform admins. Resolves account ids for the errors dashboard. Unknown and deleted accounts are omitted.
  """
  usersByIds(ids: [UUID!]!): [AdminUserLookup!]!

  """
  A reviewer of this request: a 15-minute link to one document. The view is written to the audit log.
  """
  verificationDocumentUrl(fileId: UUID!, requestId: UUID!): SignedUrl!

  """
  Verified teachers: student requests addressed to them, and students of their institution. Platform admins: every pending request. Managers, unverified teachers and students are refused. Oldest first; `after` is the last id seen.
  """
  verificationRequestsToReview(after: UUID, first: Int): [VerificationRequest!]!

  """
  Public. This running build: the package version plus the short git SHA, as vX.Y.Z+sha. Not the terms date (termsVersion).
  """
  version: String!

  """The signed-in user, null for anonymous visitors"""
  viewer: User

  """
  How to caption live. It describes the browser and does not call a model. Signed out, the note must be public.
  """
  voiceCapture(input: VoiceCaptureInput!): VoiceCapturePayload!

  """Signed in only: weak topics, each with why; an upcoming exam's first"""
  weakTopics: [WeakTopic!]!

  """The viewer's tasks this week, with how far each has come"""
