# LearnViaNotes API schema — composed from contexts/*/src/graphql/*.graphql by scripts/export-supergraph.mjs. Do not edit.
# ADR-0099 (college ID cards, lvn-backend#18, contracts 0.64.0) is included here so this app typechecks before that branch is on main. `pnpm graphql:sync` replaces this file from lvn-backend.
# lvn-backend main ebe43a2 (contracts 0.74.0): VerifyEmailPayload, resendVerification, unverifiedGatedActions as [String!]!, UserError.retryAfter, Float min/max on AdminSettingConstraints, and publicNotesRequireVerification.
# lvn-backend#48 (contracts 0.75.0): User.viewerNeedsVerification. False for a platform admin, null on anyone else's user.
# lvn-backend main 24c4a54 (contracts 0.76.0, #48 and #49): Note.allowForks, Note.forkCount, and Query.forkingEnabled(noteId). Note.forkingEnabled is gone. Visibility includes UNLISTED.
# lvn-backend#27 account admin is included the same way: AccountStatus, adminUsers, adminUpdateUser, adminSetAccountStanding, adminDeleteUser, and UserError.supportEmail.
input AcceptTermsInput {
  """Query.termsVersion, as shown to the person"""
  version: String!
}

type AccountDeletionPayload {
  """When the account will be deleted; null once cancelled"""
  deletionScheduledFor: DateTime
  userErrors: [UserError!]!
}

"""An account's standing, for its owner alone (ADR-0053)"""
type AccountStanding {
  """The suspension can still be appealed (once)"""
  canAppeal: Boolean!

  """
  Set while the account is suspended: nothing it does reaches other people until then
  """
  suspendedUntil: DateTime
  suspensionReason: String

  """Warnings from the last 90 days, newest first"""
  warnings: [AccountWarning!]!
}

"""A warning platform moderators gave an account (ADR-0053)"""
type AccountWarning {
  at: DateTime!
  reason: String!
}

"""Whether a person can sign in. AGE_BLOCKED is cleared by correcting the date of birth, not by setting it here."""
enum AccountStatus {
  ACTIVE
  AGE_BLOCKED
  BLOCKED
  SUSPENDED
}

"""An achievement: the highest tier reached of one kind (and subject)"""
type Achievement {
  """What it says the person did"""
  description: String!
  earnedAt: DateTime!
  id: UUID!
  kind: AchievementKind!

  """For a subject contributor"""
  subjectTitle: String

  """The threshold reached: 5 topics, 12 weeks, 250 points…"""
  tier: Int!
  title: String!
}

"""What an achievement marks"""
enum AchievementKind {
  """Exams that reached their Readiness target before the day"""
  EXAM_READY

  """Topics with at least 30 quiz answers, nine in ten right"""
  QUIZ_MASTER

  """Weeks whose planned days were met"""
  RHYTHM_WEEKS

  """Points from public notes on one subject"""
  SUBJECT_CONTRIBUTOR

  """Topics recalled well and answered right (mastery ≥ 0.8)"""
  TOPICS_MASTERED
}

type AchievementSettings {
  """Only adults may show them"""
  canShow: Boolean!

  """Achievements and level shown on the viewer's profile"""
  showAchievements: Boolean!
}

type AchievementSettingsPayload {
  settings: AchievementSettings
  userErrors: [UserError!]!
}

type ActivityConnection {
  edges: [ActivityEdge!]!
  pageInfo: PageInfo!
}

type ActivityEdge {
  cursor: String!
  node: ActivityItem!
}

type ActivityItem {
  """Who posted, asked or shared; null for REPOSITORY"""
  actor: User

  """CLASS_ANNOUNCEMENT"""
  announcement: ClassroomPost
  at: DateTime!
  classroom: Classroom

  """DOUBT"""
  doubt: Doubt
  group: Group

  """
  Unique in the feed: a note shared to two places is two items. Deliberately not an id, so caches keep items apart
  """
  key: String!
  kind: ActivityKind!

  """SHARED_NOTE: null when the viewer can no longer read it"""
  note: Note

  """GROUP_POST and IDEA"""
  post: GroupPost

  """
  REPOSITORY: a commit, pull request or issue in a workspace's repository (ADR-0078)
  """
  repositoryEvent: RepositoryEvent
}

enum ActivityKind {
  CLASS_ANNOUNCEMENT
  DOUBT
  GROUP_POST
  IDEA
  REPOSITORY
  SHARED_NOTE
}

input AddCommentInput {
  body: JSON!

  """A card of the note"""
  cardId: UUID

  """Reply to this top-level comment"""
  parentId: UUID
  target: CommentTargetInput!
}

input AddExternalIdentityInput {
  kind: ExternalIdentityKind!

  """A GitHub user name (or its profile's address), or a page's address"""
  value: String!
}

input AddPdfHighlightInput {
  cardId: UUID

  """YELLOW when left out"""
  color: HighlightColor
  comment: String

  """A PDF attached to the note"""
  fileId: UUID!
  kind: HighlightKind!
  noteId: UUID!
  page: Int!
  quote: String

  """One rectangle for an AREA; up to 100 lines for TEXT"""
  rects: [[Float!]!]!
}

input AddWeeklyTaskInput {
  kind: WeeklyTaskKind!

  """When and where (at most 140 characters)"""
  plan: String
  target: Int!

  """Needed for TOPIC_MINUTES; optional for QUIZ_ANSWERS"""
  topicId: UUID
}

"""Token sums and cost are decimal strings. Cost is micro-USD."""
type AdminAiMetrics {
  byModel: [AdminAiModelUsage!]!
  byProvider: [AdminAiProviderUsage!]!
  byTask: [AdminAiTaskUsage!]!

  """Decimal string"""
  completionTokens: String!

  """Micro-USD"""
  costMicroUsd: String!
  failures: Int!

  """Start of the AI usage window"""
  from: DateTime!

  """Decimal string"""
  promptTokens: String!
  tasksRun: Int!

  """End of the AI usage window"""
  to: DateTime!
}

"""One model's AI usage inside the metrics window"""
type AdminAiModelUsage {
  completionTokens: String!
  costMicroUsd: String!
  failures: Int!
  model: String!
  promptTokens: String!
  provider: String!
  tasksRun: Int!
}

"""One provider's AI usage inside the metrics window"""
type AdminAiProviderUsage {
  completionTokens: String!
  costMicroUsd: String!
  failures: Int!
  promptTokens: String!
  provider: String!
  tasksRun: Int!
}

"""One task's AI usage inside the metrics window"""
type AdminAiTaskUsage {
  completionTokens: String!
  costMicroUsd: String!
  failures: Int!
  promptTokens: String!
  task: String!
  tasksRun: Int!
}

"""Notes, subjects and the places people learn together"""
type AdminContentMetrics {
  classrooms: Int!
  groups: Int!
  notes: Int!
  publicNotes: Int!
  subjects: Int!
  topics: Int!
}

"""A contest as its writers see it"""
type AdminContest {
  """How many have started it"""
  attempts: Int!
  closesAt: DateTime!
  id: UUID!
  minutes: Int!
  opensAt: DateTime!
  published: Boolean!
  questionCount: Int!
  questions: [AdminContestQuestion!]!
  subjectId: UUID
  subjectTitle: String
  title: String!
}

type AdminContestPayload {
  contest: AdminContest
  userErrors: [UserError!]!
}

type AdminContestQuestion {
  choices: [ContestChoice!]!
  correctChoiceId: String!
  explanation: String!
  id: UUID!
  prompt: String!
}

"""
Platform-admin figures. from and to on adminMetrics bound AI usage only; leave them out for the last 30 days.
The window is at most 366 days. The result is cached for about a minute.
"""
type AdminMetrics {
  ai: AdminAiMetrics!
  content: AdminContentMetrics!
  generatedAt: DateTime!
  moderation: AdminModerationMetrics!
  storage: AdminStorageMetrics!
  users: AdminUserMetrics!
  verification: AdminVerificationMetrics!
}

"""Open platform moderation work"""
type AdminModerationMetrics {
  openAppeals: Int!
  openReports: Int!
}

"""One error code in the window, with who it affected."""
type AdminErrorGroup {
  code: String!
  count: Int!
  firstSeen: DateTime!
  lastSeen: DateTime!
  sampleMessage: String!

  """At most 100 distinct account ids."""
  userIds: [UUID!]!
}

"""
A plan's price is what it costs. Saving a price charges nobody.
priceMinor is minor units (49900 INR with interval MONTH is ₹499 a month).
"""
type AdminPlan {
  active: Boolean!
  code: String!
  currency: String!
  entitlements: [AdminPlanEntitlement!]!
  features: [String!]!
  id: UUID!
  interval: PlanInterval!
  name: String!
  priceMinor: Int!
  subscriberCount: Int!
}

"""limit is a decimal string, or null when the entitlement is unlimited"""
type AdminPlanEntitlement {
  appliesToRole: GlobalRole
  key: LimitKey!
  limit: String
}

input AdminPlanEntitlementInput {
  appliesToRole: GlobalRole
  key: LimitKey!
  limit: String
}

type AdminPlanPayload {
  plan: AdminPlan
  userErrors: [UserError!]!
}

"""
A platform setting. value is "true" or "false", a decimal integer, text, or "" when a nullable integer is cleared.
overridden is false when the environment default is in effect.
Categories: auth, verification, uploads, ai, search, accounts.
"""
type AdminSetting {
  category: String!
  constraints: AdminSettingConstraints!
  description: String!
  key: String!
  overridden: Boolean!
  type: AdminSettingType!
  updatedAt: DateTime
  value: String!
}

type AdminSettingConstraints {
  max: Float
  maxLength: Int
  min: Float
  nullable: Boolean!
  pattern: String
}

type AdminSettingPayload {
  setting: AdminSetting
  userErrors: [UserError!]!
}

enum AdminSettingType {
  BOOLEAN
  INTEGER
  STRING
}

"""Stored bytes and how many files they are"""
type AdminStorageMetrics {
  """Decimal string of bytes"""
  bytes: String!
  files: Int!
}

"""People with accounts"""
type AdminUserMetrics {
  active: Int!
  newLast30Days: Int!
  newLast7Days: Int!
  total: Int!
}

"""Proof of study waiting for a platform admin"""
type AdminVerificationMetrics {
  domainReviews: Int!
  pendingRequests: Int!
  studentIdQueue: Int!
}

"""
The viewer's AI tokens today (UTC) against their plan's daily limit (§10.1, ADR-0024)
"""
type AiAllowance {
  """null: the plan sets no limit"""
  limitToday: Int
  resetsAt: DateTime!
  usedToday: Int!
}

"""
An Ask AI answer: the asker's own. Its text grows while it is RUNNING (live AI_ANSWER events say when)
"""
type AiAnswer {
  createdAt: DateTime!
  doubtId: UUID

  """FAILED: why, in words for the asker"""
  error: String
  id: UUID!
  noteId: UUID
  question: String!
  scope: AskAiScope!
  sources: [AiSource!]!
  status: AiArtifactStatus!

  """Markdown citing sources as [n]"""
  text: String!
}

"""
DAU, WAU and MAU are distinct accounts in the last 1, 7 and 30 days before `to`.
"""
type AdminUsageSummary {
  dau: Int!
  from: DateTime!
  mau: Int!
  to: DateTime!
  topEvents: [UsageCount!]!
  topFeatures: [UsageCount!]!
  wau: Int!
}

"""
Display name, email and role for the errors dashboard. Platform admins only.
"""
type AdminUserLookup {
  displayName: String!
  email: String!
  globalRole: GlobalRole!
  id: UUID!
}

"""A person a platform admin can correct, block, suspend or delete."""
type AdminManagedUser {
  accountStatus: AccountStatus!
  createdAt: DateTime!

  """YYYY-MM-DD. Null when the account has no date of birth on file."""
  dateOfBirth: String
  displayName: String!
  email: String!
  globalRole: GlobalRole!
  handle: String!
  id: UUID!

  """Why the account is age-blocked, blocked or suspended. Null when active."""
  statusReason: String
}

"""Accounts for one status tab."""
type AdminUserList {
  total: Int!
  users: [AdminManagedUser!]!
}

type AdminUserPayload {
  user: AdminManagedUser
  userErrors: [UserError!]!
}

"""Which accounts adminUsers returns. BLOCKED_OR_SUSPENDED is both blocked and suspended accounts."""
enum AdminUserStatusFilter {
  ACTIVE
  AGE_BLOCKED
  BLOCKED_OR_SUSPENDED
}

"""Permanently deletes an account. confirm is the exact word DELETE."""
input AdminDeleteUserInput {
  confirm: String!
  reason: String
  userId: UUID!
}

"""
ACTIVE lifts a block. until is required when status is SUSPENDED.
AGE_BLOCKED is refused; the fix is to correct the date of birth.
"""
input AdminSetAccountStandingInput {
  reason: String!
  status: AccountStatus!
  until: DateTime
  userId: UUID!
}

"""
Edits the name, email or date of birth and re-runs the age gate.
A date of birth that passes clears AGE_BLOCKED. reason is required on every edit.
"""
input AdminUpdateUserInput {
  """YYYY-MM-DD. The age gate runs again."""
  dateOfBirth: String
  displayName: String
  email: String
  reason: String!
  userId: UUID!
}

"""
What a task made for the viewer from a note (ADR-0059). Only its maker sees it, while they can read the note
"""
type AiArtifact {
  """Card tasks, once READY: the cards to choose from"""
  cards: [AiCard!]

  """
  CLEAN_UP, once READY: the changes to choose from (empty when nothing needs mending)
  """
  changes: [AiChange!]
  createdAt: DateTime!

  """FAILED: why, in words for the person"""
  error: String

  """
  Made from the published version (the viewer is a reader) rather than the draft
  """
  fromPublishedVersion: Boolean!
  id: UUID!
  keptAt: DateTime
  language: AiLanguage!

  """Text tasks, once READY: the result as Markdown"""
  markdown: String
  note: Note!
  status: AiArtifactStatus!
  task: AiTask!

  """Card tasks, once READY: the title a new note would take"""
  title: String

  """The note was longer than a task reads; its start was used"""
  truncated: Boolean!
}

type AiArtifactPayload {
  artifact: AiArtifact
  userErrors: [UserError!]!
}

enum AiArtifactStatus {
  FAILED
  QUEUED
  READY
  RUNNING
}

"""
A card a task made, exactly as it would be kept: `type` and `content` as in the notes subgraph's Card
"""
type AiCard {
  content: JSON!
  type: String!
}

"""A card's words as CLEAN_UP would leave them (ADR-0063)"""
type AiChange {
  after: String!

  """Applied to the note with applyAiChanges"""
  applied: Boolean!

  """What the card said when the change was made"""
  before: String!
  cardId: UUID!
}

type AiConnection {
  """null: the kind's own address"""
  baseUrl: String
  chatModel: String
  embedMicroUsdPerMTok: Int!
  embedModel: String
  enabled: Boolean!

  """A key is saved; it is never shown again"""
  hasKey: Boolean!
  id: UUID!

  """
  Prices of its default models in millionths of a dollar per million tokens; the monthly budget counts them
  """
  inputMicroUsdPerMTok: Int!

  """The key's last four characters"""
  keyHint: String
  kind: AiProviderKind!
  label: String!

  """
  §10.1's data-processing flag: notes that are not public may go to it (self-hosted, or a zero-retention agreement)
  """
  mayReceivePrivate: Boolean!
  outputMicroUsdPerMTok: Int!
  updatedAt: DateTime!
}

input AiConnectionIdInput {
  id: UUID!
}

"""
Every model a connection's account lists, and the same models split into the pickers the admin selects from.
Bind each select to the picker for that use. An empty picker is not shown.
"""
type AiConnectionModels {
  all: [AiListedModel!]!
  pickers: [AiModelPicker!]!
}

type AiConnectionPayload {
  connection: AiConnection
  userErrors: [UserError!]!
}

type AiConnectionTest {
  latencyMs: Int!

  """What happened; the provider's own words when it failed"""
  message: String!

  """Models the account lists; empty when the provider does not list them"""
  models: [String!]!
  ok: Boolean!
}

type AiConnectionTestPayload {
  test: AiConnectionTest
  userErrors: [UserError!]!
}

"""
The environment's own provider (AI_PROVIDER), which answers when no connection is chosen
"""
type AiEnvironmentProvider {
  chatModel: String
  embedModel: String

  """null: AI_PROVIDER is none"""
  kind: AiProviderKind
}

"""
A study aid made from a public note's published version: a summary, key concepts, practice questions, a quiz or flashcards
"""
type AiInsight {
  cards: [AiCard!]

  """Hidden by the owner: only they see it"""
  hidden: Boolean!
  id: UUID!

  """Text aids, once READY"""
  markdown: String
  status: AiArtifactStatus!
  task: AiTask!

  """Card aids (quiz, flashcards), once READY: the title a kept note takes"""
  title: String
  versionId: UUID!
}

enum AiLanguage {
  ENGLISH
  HINDI
  TELUGU
}

"""A model the provider lists for a connection"""
type AiListedModel {
  id: String!
  kind: AiModelKind!
  supports: [AiModelUse!]!
}

enum AiModelKind {
  AUDIO
  CHAT
  EMBEDDING
  IMAGE
  MODERATION
  OTHER
  REALTIME
  TTS
}

"""Models that support one use, for one select"""
type AiModelPicker {
  models: [AiListedModel!]!
  use: AiModelUse!
}

enum AiModelUse {
  AUDIO
  CHAT
  EMBEDDING
  IMAGE
  MODERATION
  REALTIME
  TRANSCRIBE
  TTS
}

"""Who answers AI calls"""
enum AiProviderKind {
  ANTHROPIC
  GEMINI
  OLLAMA
  OPENAI

  """
  Any server that speaks OpenAI's API: a LiteLLM proxy, OpenRouter, vLLM…
  """
  OPENAI_COMPATIBLE
}

"""What a kind of provider is and can do"""
type AiProviderPreset {
  canEmbed: Boolean!

  """Takes recordings (transcription)"""
  canHear: Boolean!

  """Hints; a connection test lists what the account has"""
  chatModels: [String!]!

  """null: the connection must give an address"""
  defaultBaseUrl: String
  embedModels: [String!]!
  kind: AiProviderKind!
  name: String!
  needsKey: Boolean!

  """
  Private notes may go to it unless an admin says otherwise (a model on our own machine)
  """
  privateByDefault: Boolean!
}

type AiSettings {
  """Answers chats; null: the environment's provider"""
  chatConnectionId: UUID
  connections: [AiConnection!]!

  """
  Makes embeddings (Ask AI, meaning search); null: the environment's provider
  """
  embedConnectionId: UUID
  environment: AiEnvironmentProvider!

  """AI_KEYS_SECRET is set, so keys can be saved"""
  keysCanBeSaved: Boolean!

  """null: no monthly cap"""
  monthlyBudgetMicroUsd: Int
  presets: [AiProviderPreset!]!
  routes: [AiTaskRoute!]!
  spentThisMonthMicroUsd: Int!

  """Tasks a route can be set for"""
  tasks: [String!]!
}

type AiSettingsPayload {
  settings: AiSettings
  userErrors: [UserError!]!
}

"""A passage an answer cites, by its number in the answer ([1], [2] …)"""
type AiSource {
  cardIds: [UUID!]!
  n: Int!
  noteId: UUID!
  snippet: String!
  title: String!

  """
  The published version it came from; null for a draft (this note, asked by its owner or an editor)
  """
  versionId: UUID
}

type AiStatus {
  available: Boolean!
  reason: AiUnavailableReason
}

enum AiTask {
  """
  Mends what PDF conversion broke in the text, heading and quote cards of a note the person may edit, as changes to apply (ADR-0063)
  """
  CLEAN_UP

  """Needs the right to copy the note (ADR-0025)"""
  CREATE_NOTES

  """On the note's code cards"""
  EXPLAIN_CODE
  EXPLAIN_SIMPLY
  FIND_MISTAKES
  FLASHCARDS
  KEY_CONCEPTS

  """Needs the right to copy the note (ADR-0025)"""
  OUTLINE_TO_NOTE
  PRACTICE_QUESTIONS

  """
  The person's own note's rough words and photos, as a structured note (ADR-0062)
  """
  QUICK_NOTE
  QUIZ
  REVISION_SHEET
  SUMMARIZE

  """One audio or video card (cardIds), as a text card to keep (ADR-0062)"""
  TRANSCRIBE
  TRANSLATE
}

"""A task sent to a connection and model instead of the default"""
type AiTaskRoute {
  """null: the default connection"""
  connectionId: UUID
  inputMicroUsdPerMTok: Int!
  model: String!
  outputMicroUsdPerMTok: Int!
  task: String!
}

input AiTaskRouteInput {
  task: String!
}

"""Why AI is not answering"""
enum AiUnavailableReason {
  """This month's AI budget is used up; it resumes next month"""
  BUDGET

  """Not switched on in this environment"""
  NOT_CONFIGURED

  """The model failed several times in a row; it is tried again shortly"""
  PROVIDER_DOWN
}

input AnswerClassroomInviteInput {
  accept: Boolean!
  inviteId: UUID!
}

input AnswerContestQuestionInput {
