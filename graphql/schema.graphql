# LearnViaNotes API schema — composed from contexts/*/src/graphql/*.graphql by scripts/export-supergraph.mjs. Do not edit.
input AcceptTermsInput {
  """Query.termsVersion, as shown to the person"""
  version: String!
}

input AddPdfHighlightInput {
  cardId: UUID

  """YELLOW when left out"""
  color: HighlightColor
  comment: String

  """A PDF attached to the note"""
  fileId: UUID!
  kind: HighlightKind!
  noteId: UUID!
  page: Int!
  quote: String

  """One rectangle for an AREA; up to 100 lines for TEXT"""
  rects: [[Float!]!]!
}

input AppealModerationInput {
  entityId: UUID!
  entityType: ReportEntityType!
  message: String!
}

type AuthPayload {
  session: Session
  userErrors: [UserError!]!
}

"""
One block of a note (§4.1). `position` orders cards (a fractional index: compare as plain strings, then by id).
"""
type Card {
  """Shape depends on `type` (@lvn/contracts/validation CARD_CONTENT)"""
  content: JSON!
  id: UUID!

  """
  The file of an image, video, audio or file card; null for other cards, or when the file is gone
  """
  media: MediaFile
  position: String!

  """
  Send it back as baseRevision when changing or deleting the card (§13.2)
  """
  revision: Int!
  type: CardType!
}

type CardConnection {
  edges: [CardEdge!]!
  pageInfo: PageInfo!
}

type CardEdge {
  cursor: String!
  node: Card!
}

"""
A card as the client has it. Ids are UUIDs the client makes, so cards created offline keep their id.
"""
input CardInput {
  content: JSON!
  id: UUID!
  position: String!
  type: CardType!
}

input CardOpInput {
  """The card's revision the client last saw; omitted for new cards"""
  baseRevision: Int
  content: JSON
  id: UUID!
  kind: CardOpKind!
  position: String
  type: CardType
}

enum CardOpKind {
  """Remove the card; send `baseRevision`"""
  DELETE

  """Change only `position`"""
  MOVE

  """Create the card, or change it; send `baseRevision` when changing"""
  UPSERT
}

type CardOpResult {
  id: UUID!
  message: String

  """The card's revision after the save"""
  revision: Int
  status: CardOpStatus!
}

enum CardOpStatus {
  APPLIED

  """
  Applied, but the card had changed on another device since baseRevision: that version is kept in `conflictVersion`
  """
  APPLIED_WITH_CONFLICT

  """
  Not applied: the card was deleted, or changed elsewhere before this delete
  """
  REJECTED
}

"""
The sixteen card types (§4.1); content is validated per type (@lvn/contracts/validation)
"""
enum CardType {
  audio
  callout
  checklist
  code
  diagram
  file
  flashcard
  heading
  image
  markdown
  question
  quiz
  quote
  table
  text
  video
}

input ChangeNoteVisibilityInput {
  noteId: UUID!
  visibility: Visibility!
}

"""
After a provider sign-in (no signUp call): the same details, collected once
"""
input CompleteRegistrationInput {
  acceptedTermsVersion: String!
  dateOfBirth: String!
  displayName: String!
  institutionalEmail: String
}

enum ConnectionDirection {
  """They asked the viewer"""
  INCOMING

  """The viewer asked them"""
  OUTGOING
}

input ConnectionRequestInput {
  requestId: UUID!
}

type ConnectionRequestItem {
  createdAt: DateTime!
  direction: ConnectionDirection!
  id: UUID!

  """Who asked (INCOMING) or was asked (OUTGOING)"""
  person: User!
}

input ConvertPdfInput {
  """A PDF of the note the viewer can read"""
  fileId: UUID!
  noteId: UUID!
}

type CoreProblemMark {
  mark: ProblemMark!
  problemId: String!
}

"""
Progress on a /core subject — the old site's history plus everything recorded since
"""
type CoreSubjectProgress {
  problems: [CoreProblemMark!]!
  subjectId: String!
  topics: [CoreTopicProgress!]!
}

"""topicKey = subjectId/topicId of the /core content"""
type CoreTopicProgress {
  completed: Boolean!
  lastStudiedAt: DateTime
  revisit: Boolean!
  secondsStudied: Int!
  topicKey: String!
}

input CreateFolderInput {
  name: String!
  parentId: UUID
}

input CreateGroupInput {
  """At most 2,000 characters"""
  description: String

  """
  OPEN lets anyone join a public group at once; new groups approve members unless told otherwise
  """
  joinPolicy: GroupJoinPolicy

  """3 to 80 characters"""
  name: String!
  privacy: GroupPrivacy!
}

input CreateGroupPostInput {
  body: JSON!
  groupId: UUID!
}

input CreateNoteInput {
  cards: [CardInput!]
  folderId: UUID

  """
  Made on the device for a note written offline (a UUIDv7, §13.2); leave out to let the server choose
  """
  id: UUID
  kind: NoteKind
  tagNames: [String!]
  title: String
  topicIds: [UUID!]
}

input CreateUploadIntentInput {
  """Shown to people; never part of the storage key"""
  fileName: String!
  mimeType: String!
  parentId: UUID
  purpose: FilePurpose!
  sizeBytes: Int!
}

type DataExport {
  """
  While READY: a download link that works for 15 minutes; ask again for a new one
  """
  downloadUrl: String

  """Kept until then (7 days)"""
  expiresAt: DateTime
  id: UUID!
  readyAt: DateTime
  requestedAt: DateTime!
  sizeBytes: Float
  status: DataExportStatus!
}

type DataExportPayload {
  export: DataExport
  userErrors: [UserError!]!
}

enum DataExportStatus {
  EXPIRED
  FAILED
  PENDING
  READY
}

scalar DateTime

input DecideDomainReviewInput {
  approve: Boolean!
  domain: String!
}

type DomainReview {
  domain: String!
  firstSeenAt: DateTime!

  """How many people asked for it"""
  requests: Int!
  status: DomainReviewStatus!
}

enum DomainReviewStatus {
  ACADEMIC_QUEUED
  APPROVED
  NEEDS_REVIEW
  REJECTED
}

input EditGroupPostInput {
  body: JSON!
  postId: UUID!
}

"""Fixed error vocabulary (§6.2)"""
enum ErrorCode {
  CONFLICT
  FORBIDDEN
  INTERNAL
  NOT_FOUND
  RATE_LIMITED
  UNAUTHENTICATED
  VALIDATION
}

"""
What an upload is for: AVATAR, VERIFICATION_DOCUMENT, and ATTACHMENT (a picture, video, audio or PDF for a note you can edit, given as parentId). Other purposes arrive with their features.
"""
enum FilePurpose {
  ATTACHMENT
  AVATAR
  COVER
  EXPORT
  IMPORT
  VERIFICATION_DOCUMENT
  VOICE_NOTE
}

"""The viewer's folder; nested up to 5 levels"""
type Folder {
  id: UUID!
  name: String!

  """Live notes directly in this folder"""
  noteCount: Int!
  parentId: UUID
}

type FolderPayload {
  folder: Folder
  userErrors: [UserError!]!
}

"""
Where a copy came from (§4.4, ADR-0010). Every reader sees the author; the origin itself only those who can open it.
"""
type ForkCredit {
  author: User!
  note: Note
  title: String
}

enum GlobalRole {
  PLATFORM_ADMIN
  STUDENT
  TEACHER
}

"""
A group, owned by the core subgraph: null when the viewer may no longer see it
"""
type Group {
  createdAt: DateTime!
  description: String
  id: UUID!

  """A private group always approves members, whatever was chosen"""
  joinPolicy: GroupJoinPolicy!

  """Admins only: requests waiting for an answer, oldest first"""
  joinRequests: [GroupJoinRequest!]
  memberCount: Int!

  """Members only"""
  members: [GroupMember!]
  name: String!
  owner: User!

  """Members only: pinned posts, then the newest"""
  posts(after: String, first: Int): GroupPostConnection
  privacy: GroupPrivacy!

  """
  Members only: notes shared to the group that the viewer may open, the most recently shared first
  """
  sharedNotes(after: String, first: Int): NoteConnection
  type: GroupType!
  viewerCan: GroupActions!

  """The viewer's request to join, while it waits"""
  viewerRequestId: UUID
  viewerRole: GroupRole
}

"""
What the viewer may do in the group, from the same rules the API applies
"""
type GroupActions {
  delete: Boolean!
  join: Boolean!
  leave: Boolean!
  manage: Boolean!
  moderate: Boolean!
  post: Boolean!
  requestJoin: Boolean!
  reviewRequests: Boolean!
}

input GroupIdInput {
  groupId: UUID!
}

enum GroupJoinPolicy {
  APPROVAL
  OPEN
}

type GroupJoinRequest {
  createdAt: DateTime!
  id: UUID!
  message: String
  user: User!
}

type GroupMember {
  joinedAt: DateTime!

  """Muted members cannot post until then"""
  mutedUntil: DateTime
  role: GroupRole!
  user: User!
}

input GroupMemberInput {
  groupId: UUID!
  userId: UUID!
}

type GroupPayload {
  group: Group
  userErrors: [UserError!]!
}

type GroupPost {
  author: User!

  """Rich text: a card's document"""
  body: JSON!
  createdAt: DateTime!
  editedAt: DateTime
  id: UUID!
  pinned: Boolean!
  viewerCan: GroupPostActions!
}

type GroupPostActions {
  delete: Boolean!
  edit: Boolean!
  pin: Boolean!
}

type GroupPostConnection {
  edges: [GroupPostEdge!]!
  pageInfo: PageInfo!

  """On the first page only"""
  pinned: [GroupPost!]!
}

type GroupPostEdge {
  cursor: String!
  node: GroupPost!
}

input GroupPostIdInput {
  postId: UUID!
}

type GroupPostPayload {
  post: GroupPost
  userErrors: [UserError!]!
}

enum GroupPrivacy {
  PRIVATE
  PUBLIC
}

enum GroupRole {
  ADMIN
  MEMBER
  MENTOR
  MODERATOR
  OWNER
}

enum GroupType {
  COMMUNITY
  PROJECT
}

enum HighlightColor {
  BLUE
  GREEN
  PINK
  PURPLE
  YELLOW
}

enum HighlightKind {
  """An area of the page, such as a figure or a formula"""
  AREA

  """A passage of text"""
  TEXT
}

input IdInput {
  id: UUID!
}

input ImportNotesInput {
  """
  A READY upload with purpose IMPORT: an LVN export, a ZIP of Markdown with pictures, or a Markdown or text file
  """
  fileId: UUID!
}

type ImportSkip {
  """The file (or card) in the upload"""
  path: String!
  reason: String!
}

type ImportedNote {
  id: UUID!
  title: String!
}

type Institution {
  name: String!
  verified: Boolean!
}

enum InstitutionalEmailStatus {
  """A code was sent to the address and not yet entered"""
  CODE_SENT

  """Confirmed; the account is verified by it"""
  CONFIRMED

  """No college or organisation email yet"""
  NONE

  """
  Confirmed, but the domain waits for platform-admin review before it verifies the account
  """
  PENDING_REVIEW
}

scalar JSON

enum JoinDecision {
  APPROVED
  REJECTED
}

input JoinRequestIdInput {
  requestId: UUID!
}

type LegacyCounts {
  completedTopics: Int!
  markedProblems: Int!
  notes: Int!
  studyDays: Int!
  studyMinutes: Int!
}

type LegacyImport {
  claimedAt: DateTime
  counts: LegacyCounts
  status: LegacyImportStatus!
}

enum LegacyImportStatus {
  AVAILABLE
  CLAIMED
  DECLINED
  NOT_FOUND
}

"""
A plan limit and current use, for "3 of 5 groups" and early warnings; limit null = unlimited
"""
type Limit {
  key: LimitKey!
  limit: Float
  used: Float!
}

enum LimitKey {
  AI_TOKENS_DAILY
  CLASSROOMS_OWNED
  CLASSROOM_MEMBERS
  EXPORTS_DAILY
  GROUPS_OWNED
  GROUP_MEMBERS
  IMPORTS_DAILY
  ORG_SEATS
  PDF_PAGES_MONTHLY
  PROJECT_WORKSPACES
  STORAGE_BYTES
}

input MarkNotificationsReadInput {
  all: Boolean

  """These notifications; ignored when all is true"""
  ids: [UUID!]
}

type MarkNotificationsReadPayload {
  """What stays unread"""
  unreadCount: Int!
  userErrors: [UserError!]!
}

"""
A file a media card shows. The url works for 15 minutes (until expiresAt); load the card again for a new one.
"""
type MediaFile {
  durationMs: Int
  expiresAt: DateTime!
  fileName: String!
  height: Int
  id: UUID!
  largeUrl: String
  mediumUrl: String
  mimeType: String!
  pageCount: Int

  """The 720p H.264 transcode of a video, or the loudness-normalised audio"""
  playbackUrl: String

  """A frame of a video (WebP)"""
  posterUrl: String
  sizeBytes: Int!

  """
  Made after the upload (ADR-0041); null until made: pictures 320, 960 and 1920 pixels wide (WebP)
  """
  thumbUrl: String
  url: String!
  width: Int
}

input ModerateContentInput {
  action: ModerationActionType!
  entityId: UUID!
  entityType: ReportEntityType!

  """Required for HIDE, REMOVE and WARN: the author is told"""
  reason: String
}

"""A note as moderators see it: the published version readers would see"""
type ModeratedNote {
  deleted: Boolean!
  excerpt: String!
  id: UUID!
  moderation: ModerationState!
  moderationReason: String
  owner: User!
  title: String!
  visibility: String!
}

"""
APPROVE frees a held note; HIDE and REMOVE take it off for everyone but its author; DISMISS closes reports; WARN tells the author. SUSPEND is not available yet.
"""
enum ModerationActionType {
  APPROVE
  DISMISS
  HIDE
  REMOVE
  SUSPEND
  WARN
}

type ModerationAppeal {
  createdAt: DateTime!
  message: String!
}

type ModerationCase {
  appeal: ModerationAppeal
  entityId: UUID!
  entityType: ReportEntityType!

  """Set for NOTE cases"""
  note: ModeratedNote
  openedAt: DateTime!
  reports: [ModerationReport!]!

  """Set for USER cases"""
  user: User
}

type ModerationCaseConnection {
  edges: [ModerationCaseEdge!]!
  pageInfo: PageInfo!
}

type ModerationCaseEdge {
  cursor: String!
  node: ModerationCase!
}

type ModerationReport {
  createdAt: DateTime!
  details: String
  reason: ReportReason!

  """null when the scorer held the content on its way to the public"""
  reporter: User
}

enum ModerationState {
  HIDDEN
  OK
  PENDING_REVIEW
  REMOVED
}

type Mutation {
  """Accept the current Terms, Privacy Policy and content licence"""
  acceptTerms(input: AcceptTermsInput!): OkPayload!

  """Owner and editors"""
  addPdfHighlight(input: AddPdfHighlightInput!): PdfHighlightPayload!

  """The author's one appeal against hiding or removing their note"""
  appealModeration(input: AppealModerationInput!): OkPayload!

  """
  Ends follows both ways and stops new interaction both ways; they are not told
  """
  blockUser(input: PersonInput!): PersonPayload!

  """
  PRIVATE, SHARED or PUBLIC (owner, verified account); PUBLIC needs a published version
  """
  changeNoteVisibility(input: ChangeNoteVisibilityInput!): NotePayload!

  """Attach the old site's data to this account"""
  claimLegacyData: OkPayload!
  completeRegistration(input: CompleteRegistrationInput!): OkPayload!

  """Checks the uploaded bytes (size, magic bytes) and makes the file READY"""
  completeUpload(fileId: UUID!): OkPayload!
  confirmNoteImport(input: NoteIdInput!): NoteImportPayload!

  """
  Convert a PDF of a note the viewer can read into a new PRIVATE note of their own (the rule for copies), counted
  against their PDF pages this month; follow it with pdfConversion. One at a time.
  """
  convertPdfToNote(input: ConvertPdfInput!): PdfConversionPayload!
  createFolder(input: CreateFolderInput!): FolderPayload!
  createGroup(input: CreateGroupInput!): GroupPayload!
  createGroupPost(input: CreateGroupPostInput!): GroupPostPayload!
  createNote(input: CreateNoteInput!): NotePayload!
  createUploadIntent(input: CreateUploadIntentInput!): UploadIntentPayload!

  """Platform admins"""
  decideDomainReview(input: DecideDomainReviewInput!): OkPayload!

  """Decline the old site's data, or remove it after it was attached"""
  declineLegacyData: OkPayload!

  """Its notes and subfolders move up one level"""
  deleteFolder(input: IdInput!): OkPayload!

  """The owner; the group is gone for everyone"""
  deleteGroup(input: GroupIdInput!): OkPayload!

  """Its author, or a moderator"""
  deleteGroupPost(input: GroupPostIdInput!): GroupPayload!

  """Move to the trash, restorable for 30 days (§4.5)"""
  deleteNote(input: NoteIdInput!): NotePayload!

  """Delete a note in the trash now, for good"""
  deleteNoteForever(input: NoteIdInput!): OkPayload!

  """Removes the tag from every note"""
  deleteTag(input: IdInput!): OkPayload!
  editGroupPost(input: EditGroupPostInput!): GroupPostPayload!
  followUser(input: PersonInput!): PersonPayload!

  """
  A PRIVATE copy of a note you may fork, credited to its origin; returns the copy
  """
  forkNote(input: NoteIdInput!): NotePayload!

  """Import notes; everything arrives PRIVATE. Five imports a day"""
  importNotes(input: ImportNotesInput!): NoteImportPayload!

  """A public group with the OPEN policy"""
  joinGroup(input: GroupIdInput!): GroupPayload!

  """The owner hands the group over first"""
  leaveGroup(input: GroupIdInput!): GroupPayload!
  markNotificationsRead(input: MarkNotificationsReadInput!): MarkNotificationsReadPayload!

  """A moderator's decision on a case (PLATFORM_ADMIN)"""
  moderateContent(input: ModerateContentInput!): OkPayload!
  muteGroupMember(input: MuteGroupMemberInput!): GroupPayload!
  oauthExchange(input: OAuthExchangeInput!): AuthPayload!
  pinGroupPost(input: PinGroupPostInput!): GroupPostPayload!
  proposeTopic(input: ProposeTopicInput!): TopicPayload!

  """
  Snapshot the draft as the version readers see (owner; a verified account)
  """
  publishNote(input: NoteIdInput!): NotePayload!
  refreshSession(input: RefreshSessionInput!): AuthPayload!
  removeConnection(input: PersonInput!): PersonPayload!

  """Stops someone following you; they are not told"""
  removeFollower(input: PersonInput!): PersonPayload!
  removeGroupMember(input: GroupMemberInput!): GroupPayload!
  removePdfHighlight(input: PdfHighlightIdInput!): OkPayload!
  renameTag(input: RenameTagInput!): TagPayload!

  """
  Report a note or a person you can see; reporting again updates your report
  """
  reportContent(input: ReportContentInput!): OkPayload!

  """Teacher to teacher; the other accepts or declines (ADR-0013)"""
  requestConnection(input: PersonInput!): PersonPayload!

  """
  Ask for an archive of everything about you: notes as Markdown and JSON with their files, and your account data. One a day; you are emailed when it is ready
  """
  requestDataExport: DataExportPayload!
  requestDocumentVerification(input: RequestDocumentVerificationInput!): VerificationRequestPayload!

  """Always ok, whether or not an account exists"""
  requestPasswordReset(input: RequestPasswordResetInput!): OkPayload!
  requestTeacherVerification(input: RequestTeacherVerificationInput!): VerificationRequestPayload!

  """Every other group: the admins accept or reject"""
  requestToJoinGroup(input: RequestToJoinGroupInput!): GroupPayload!
  resendInstitutionalEmailCode: OkPayload!

  """Sets the password and signs out every device"""
  resetPassword(input: ResetPasswordInput!): OkPayload!

  """Returns the person who asked"""
  respondToConnectionRequest(input: RespondToConnectionRequestInput!): PersonPayload!
  restoreNote(input: NoteIdInput!): NotePayload!

  """
  Make an old version the draft again; the current draft is kept as a DRAFT version
  """
  restoreNoteVersion(input: RestoreNoteVersionInput!): NotePayload!

  """
  Their comments wait for your approval and they cause you no notifications; they are not told
  """
  restrictUser(input: PersonInput!): PersonPayload!
  reviewGroupJoinRequest(input: ReviewGroupJoinRequestInput!): GroupPayload!

  """
  Teachers: requests addressed to them. Platform admins: all, including documents.
  """
  reviewVerificationRequest(input: ReviewVerificationRequestInput!): VerificationRequestPayload!

  """
  Platform admins: TEACHER is granted by review, not by an email address (§5, ADR-0017)
  """
  setGlobalRole(input: SetGlobalRoleInput!): OkPayload!
  setGroupRole(input: SetGroupRoleInput!): GroupPayload!

  """
  Adds or replaces the college or organisation email; a code is sent to it
  """
  setInstitutionalEmail(input: SetInstitutionalEmailInput!): OkPayload!

  """Allow or stop copies of your note"""
  setNoteForking(input: SetNoteForkingInput!): NotePayload!

  """
  Teachers: share with all your connections, live, or stop (people shared with directly keep their access)
  """
  setNoteSharedWithConnections(input: SetNoteSharedWithConnectionsInput!): NotePayload!

  """
  Share with one person, or change their role; a PRIVATE note becomes SHARED
  """
  shareNote(input: ShareNoteInput!): NotePayload!

  """Share your note with a group you are in; a PRIVATE note becomes SHARED"""
  shareNoteToGroup(input: NoteGroupInput!): NotePayload!
  signIn(input: SignInInput!): AuthPayload!
  signInWithGoogle(input: SignInWithGoogleInput!): AuthPayload!

  """Ends this device's session (its whole refresh-token family)"""
  signOut: OkPayload!
  signUp(input: SignUpInput!): AuthPayload!

  """
  Start notes of your own on a PDF of a note you can read (the rule for copies): a new PRIVATE note with the PDF in a
  file card, crediting the original note when it was someone else's
  """
  studyPdf(input: StudyPdfInput!): NotePayload!

  """Apply a device's outbox in order (at most 100 operations)"""
  syncPush(ops: [SyncOpInput!]!): SyncPushPayload!
  unblockUser(input: PersonInput!): PersonPayload!
  unfollowUser(input: PersonInput!): PersonPayload!
  unrestrictUser(input: PersonInput!): PersonPayload!
  unshareNote(input: UnshareNoteInput!): NotePayload!
  unshareNoteFromGroup(input: NoteGroupInput!): NotePayload!
  updateFolder(input: UpdateFolderInput!): FolderPayload!

  """Admins: name, description, privacy, join policy"""
  updateGroup(input: UpdateGroupInput!): GroupPayload!
  updateNoteDraft(input: UpdateNoteDraftInput!): UpdateNoteDraftPayload!
  updatePdfHighlight(input: UpdatePdfHighlightInput!): PdfHighlightPayload!
  updateProfile(input: UpdateProfileInput!): ProfilePayload!
  updateTeacherProfile(input: UpdateTeacherProfileInput!): TeacherProfilePayload!
  verifyEmail(input: VerifyEmailInput!): OkPayload!
  verifyInstitutionalEmail(input: VerifyInstitutionalEmailInput!): OkPayload!

  """Returns the person who was asked"""
  withdrawConnectionRequest(input: ConnectionRequestInput!): PersonPayload!
  withdrawGroupJoinRequest(input: JoinRequestIdInput!): GroupPayload!
  withdrawVerificationRequest(requestId: UUID!): OkPayload!
}

input MuteGroupMemberInput {
  groupId: UUID!

  """Null lifts the mute"""
  until: DateTime
  userId: UUID!
}

"""
A note, owned by the notes subgraph: null when the viewer can no longer read it
"""
type Note {
  cardCount: Int!

  """In order; at most 100 per page"""
  cards(after: String, first: Int): CardConnection!
  createdAt: DateTime!

  """Set while the note is in the trash (owner only)"""
  deletedAt: DateTime

  """Editors only: bumped by every change to the draft"""
  draftRevision: Int

  """Editors only"""
  draftUpdatedAt: DateTime

  """
  The first words of the note (at most 180 characters), for lists and previews
  """
  excerpt: String!

  """The owner's folder; null for anyone else"""
  folder: Folder

  """Set on a copy of another note; it cannot be removed"""
  forkedFrom: ForkCredit
  forkingEnabled: Boolean!

  """Owner only: the groups the note is shared to"""
  groups: [Group!]

  """
  The owner's and editors' highlights, in page order (empty for readers); only those on one PDF with `fileId`
  """
  highlights(fileId: UUID): [PdfHighlight!]!
  id: UUID!
  kind: NoteKind!

  """Owner only; null for everyone else"""
  moderation: NoteModeration

  """The headings, for navigation"""
  outline: [OutlineItem!]!
  owner: User!

  """
  The latest conversion filling this note, for the person who asked for it
  """
  pdfConversion: PdfConversion
  publishedAt: DateTime
  publishedVersion: NoteVersion

  """
  Owner only: every connection of the owner reads it, and new connections will too (teachers, ADR-0013)
  """
  sharedWithConnections: Boolean

  """Owner only: the people the note is shared with; null for anyone else"""
  shares: [NoteShare!]

  """URL part of the title, set when published"""
  slug: String!

  """The owner's tags; empty for anyone else"""
  tags: [Tag!]!

  """Empty when untitled"""
  title: String!
  topics: [Topic!]!
  updatedAt: DateTime!

  """Editors only: one version of this note, to preview or restore"""
  version(id: UUID!): NoteVersion

  """Editors only: newest first"""
  versions(after: String, first: Int): NoteVersionConnection
  viewerAccess: NoteAccess!
  viewerCan: NotePermissions!
  visibility: Visibility!
}

"""
OWNER and EDITOR work on the draft; READER sees the published version (§4.3)
"""
enum NoteAccess {
  EDITOR
  OWNER
  READER
}

type NoteConnection {
  edges: [NoteEdge!]!
  pageInfo: PageInfo!
}

type NoteEdge {
  cursor: String!
  node: Note!
}

input NoteFilter {
  """Notes in this folder (not its subfolders)"""
  folderId: UUID
  kind: NoteKind
  tagId: UUID
  topicId: UUID

  """The trash instead of the live notes"""
  trashed: Boolean

