input AskAiInput {
  """THIS_NOTE: the note"""
  noteId: UUID
  question: String!
  scope: AskAiScope!
}

type AskAiPayload {
  answer: AiAnswer
  userErrors: [UserError!]!
}

"""Where Ask AI looks, always within what the asker may read"""
enum AskAiScope {
  """The asker's published notes"""
  MY_NOTES

  """Notes shared with the asker's groups and classes"""
  MY_PLACES
  PUBLIC

  """One note, as the asker reads it (the draft for its owner and editors)"""
  THIS_NOTE

  """Notes shared with a workspace: asked from one of its doubts (ADR-0015)"""
  WORKSPACE
}

input AskDoubtInput {
  body: JSON!
  groupId: UUID!
  repoRef: String

  """3 to 200 characters"""
  title: String!
}

type AuthPayload {
  session: Session
  userErrors: [UserError!]!
}

type BuddyTogether {
  countedDays: Int!
  target: Int!
}

"""
One block of a note (§4.1). `position` orders cards (a fractional index: compare as plain strings, then by id).
"""
type Card {
  """Shape depends on `type` (@lvn/contracts/validation CARD_CONTENT)"""
  content: JSON!
  id: UUID!

  """
  The file of an image, video, audio or file card; null for other cards, or when the file is gone
  """
  media: MediaFile
  position: String!

  """
  Send it back as baseRevision when changing or deleting the card (§13.2)
  """
  revision: Int!
  type: CardType!
}

type CardConnection {
  edges: [CardEdge!]!
  pageInfo: PageInfo!
}

type CardEdge {
  cursor: String!
  node: Card!
}

input CardIdInput {
  cardId: UUID!
}

"""
A card as the client has it. Ids are UUIDs the client makes, so cards created offline keep their id.
"""
input CardInput {
  content: JSON!
  id: UUID!
  position: String!
  type: CardType!
}

input CardOpInput {
  """The card's revision the client last saw; omitted for new cards"""
  baseRevision: Int
  content: JSON
  id: UUID!
  kind: CardOpKind!
  position: String
  type: CardType
}

enum CardOpKind {
  """Remove the card; send `baseRevision`"""
  DELETE

  """Change only `position`"""
  MOVE

  """Create the card, or change it; send `baseRevision` when changing"""
  UPSERT
}

type CardOpResult {
  id: UUID!
  message: String

  """The card's revision after the save"""
  revision: Int
  status: CardOpStatus!
}

enum CardOpStatus {
  APPLIED

  """
  Applied, but the card had changed on another device since baseRevision: that version is kept in `conflictVersion`
  """
  APPLIED_WITH_CONFLICT

  """
  Not applied: the card was deleted, or changed elsewhere before this delete
  """
  REJECTED
}

type CardReviewResult {
  cardId: UUID!
  due: DateTime!
  intervalDays: Int!
  state: ReviewState!
}

"""
The sixteen card types (§4.1); content is validated per type (@lvn/contracts/validation)
"""
enum CardType {
  audio
  callout
  checklist
  code
  diagram
  file
  flashcard
  heading
  image
