ACCOUNT: have the account verified (ADR-0019). TEACHER_ROLE: an application to teach (ADR-0073)
"""
enum VerificationPurpose {
  ACCOUNT
  TEACHER_ROLE
}

"""
Shown to the requester, the addressed teacher, a teacher at the same institution, a manager and platform admins. Documents are listed for those reviewers.
"""
type VerificationRequest {
  """
  The automated reading, once it has run. The ID number is hidden from the student.
  """
  aiCheck: IdCardCheck

  """
  True when the proof is one college ID card (ADR-0099). Kept for the retention window after a decision, and deleted at once when withdrawn.
  """
  collegeIdCard: Boolean!
  createdAt: DateTime!
  decidedAt: DateTime

  """
  Reviewers who may decide this request. Open one with verificationDocumentUrl (every view is audited).
  """
  documents: [VerificationDocument!]!
  id: UUID!

  """TEACHER_ROLE: where and what they teach"""
  institution: String
  message: String
  method: VerificationMethod!
  purpose: VerificationPurpose!
  reason: String
  requester: User!
  status: VerificationRequestStatus!
  subjects: String

  """TEACHER method: the teacher asked to vouch"""
  teacher: User
}

type VerificationRequestPayload {
  request: VerificationRequest
  userErrors: [UserError!]!
}

enum VerificationRequestStatus {
  APPROVED
  PENDING
  REJECTED
  WITHDRAWN
}

input VerifyEmailInput {
  token: String!
}

input VerifyInstitutionalEmailInput {
  code: String!
}

"""Who can read a note (§4.2)"""
enum Visibility {
  PRIVATE
  PUBLIC
  SHARED
  UNLISTED
}

type WeakTopic {
  accuracy: Float
  daysLeft: Int

  """The soonest exam it is a topic of, if any"""
  examId: UUID
  examName: String
  key: String!
  reason: WeakTopicReason!

  """Null for a /core topic: show its key"""
  title: String
  topic: Topic
}

enum WeakTopicReason {
  """Under 60 % right over the topic's last 3 quiz results"""
  LOW_ACCURACY

  """
  A topic of an exam in the next 14 days with no time on it in the last 14
  """
  NOT_REVISITED
}

type WeeklyTask {
  done: Boolean!
  id: UUID!
  kind: WeeklyTaskKind!

  """When and where, in the person's words"""
  plan: String

  """This week so far, from what learning recorded"""
  progress: Int!
  target: Int!
  topicId: UUID
  topicTitle: String
}

input WeeklyTaskIdInput {
  id: UUID!
}

enum WeeklyTaskKind {
  """Quiz answers, on a topic or any"""
  QUIZ_ANSWERS

  """Flashcards graded"""
  REVIEWS

  """Learning minutes on a topic"""
  TOPIC_MINUTES
}

type WeeklyTaskPayload {
  task: WeeklyTask
  userErrors: [UserError!]!
}

type WeeklyTasks {
  """Tasks a week may hold"""
  max: Int!
  tasks: [WeeklyTask!]!

  """The Monday of the person's Rhythm week (YYYY-MM-DD)"""
  weekStart: String!
}

enum YearOfStudy {
  GRADUATED
  NOT_STUDYING
  POSTGRADUATE
  SCHOOL
  YEAR_1
  YEAR_2
  YEAR_3
  YEAR_4
  YEAR_5
}

# Local extensions until lvn-backend contracts 0.69.0 (beta allowlist) and 0.70.0 (public plans)
# are in the exported schema. `pnpm graphql:sync` replaces this file from that export.

extend enum LimitKey {
  AI_REQUESTS_DAILY
  NOTES_OWNED
}

"""Whether sign-up and sign-in are limited to the allowlist. Public, no auth needed."""
type AccessPolicy {
  inviteOnly: Boolean!
}

"""An email allowed to sign up or sign in while the beta allowlist is on."""
type AccessAllowlistEntry {
  addedByEmail: String
  createdAt: DateTime!
  """Lowercased."""
  email: String!
  hasAccount: Boolean!
  id: UUID!
  note: String
  """Applied on sign-up, and on update when the account already exists."""
  role: GlobalRole!
}

type AccessAllowlistPayload {
  entry: AccessAllowlistEntry
  userErrors: [UserError!]!
}

input AddAccessAllowlistEntryInput {
  email: String!
  note: String
  role: GlobalRole!
}

input UpdateAccessAllowlistEntryInput {
  id: UUID!
  note: String
  role: GlobalRole
}

"""A plan limit for the viewer's role. limit is a decimal string; null means unlimited."""
type PlanLimit {
  key: LimitKey!
  label: String!
  limit: String
}

"""An active plan. current is false when nobody is signed in."""
type PublicPlan {
  code: String!
  currency: String!
  current: Boolean!
  features: [String!]!
  id: UUID!
  interval: PlanInterval!
  limits: [PlanLimit!]!
  name: String!
  priceMinor: Int!
}

"""used and limit are decimal strings. resetsAt is null when the limit is not periodic."""
type PlanUsage {
  key: LimitKey!
  label: String!
  limit: String
  resetsAt: DateTime
  used: String!
}

"""The signed-in viewer's plan. People with no subscription are on FREE."""
type MyPlan {
  plan: PublicPlan!
  usage: [PlanUsage!]!
}

extend type Query {
  """Public."""
  accessPolicy: AccessPolicy!

  """
  Public. Lowercase dotted action names closed until the sign-in email is confirmed.
  The default list is note.publish, note.share, contest.enter, payout.request, ai.bulk, resource.submit.
  The same list for everyone. An admin may add names this client does not know.
  """
  unverifiedGatedActions: [String!]!

  """Platform admins."""
  adminAccessAllowlist(search: String): [AccessAllowlistEntry!]!

  """Signed in. People with no subscription are on FREE."""
  myPlan: MyPlan!

  """Active plans only, ordered by price. Works signed out."""
  plans: [PublicPlan!]!
}

extend type Mutation {
  """CONFLICT when the email is already listed. VALIDATION for a bad email."""
  addAccessAllowlistEntry(input: AddAccessAllowlistEntryInput!): AccessAllowlistPayload!

  """
  FORBIDDEN when this would remove your own entry, or the last platform admin.
  """
  removeAccessAllowlistEntry(id: UUID!): OkPayload!

  """
  FORBIDDEN when this would demote your own entry, or the last platform admin.
  """
  updateAccessAllowlistEntry(input: UpdateAccessAllowlistEntryInput!): AccessAllowlistPayload!
}
