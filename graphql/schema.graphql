  code: String!
}

"""
Who can read a note (§4.2). UNLISTED is the link: anyone with it can read, and it is left out of lists, search and profiles.
"""
enum Visibility {
  PRIVATE
  PUBLIC
  SHARED
  UNLISTED
}

"""
One visibility the owner may set. reason is set only when enabled is false.
"""
type VisibilityChoice {
  enabled: Boolean!
  reason: String
  visibility: Visibility!
}

type VoiceCapture {
  """
  The browser API: SpeechRecognition (webkitSpeechRecognition where that is the name)
  """
  api: String!
  continuous: Boolean!
  interimResults: Boolean!

  """BCP-47 tags the apps may pass as the recognition language"""
  languages: [String!]!

  """The mutation to call with a short clip when the browser cannot caption"""
  streamingFallback: String!
}

"""
Shared by the voice operations. captions is browser SpeechRecognition text. transcript is the finished text. fileId is an uploaded recording.
"""
input VoiceCaptureInput {
  captions: String
  fileId: UUID
  noteId: UUID!
  transcript: String
}

type VoiceCapturePayload {
  userErrors: [UserError!]!
  voiceCapture: VoiceCapture
}

type WeakTopic {
  accuracy: Float
  daysLeft: Int

  """The soonest exam it is a topic of, if any"""
  examId: UUID
  examName: String
  key: String!
  reason: WeakTopicReason!

  """Null for a /core topic: show its key"""
  title: String
  topic: Topic
}

enum WeakTopicReason {
  """Under 60 % right over the topic's last 3 quiz results"""
  LOW_ACCURACY

  """
  A topic of an exam in the next 14 days with no time on it in the last 14
  """
  NOT_REVISITED
}

type WeeklyTask {
  done: Boolean!
  id: UUID!
  kind: WeeklyTaskKind!

  """When and where, in the person's words"""
  plan: String

  """This week so far, from what learning recorded"""
  progress: Int!
  target: Int!
  topicId: UUID
  topicTitle: String
}

input WeeklyTaskIdInput {
  id: UUID!
}

enum WeeklyTaskKind {
  """Quiz answers, on a topic or any"""
  QUIZ_ANSWERS

  """Flashcards graded"""
  REVIEWS

  """Learning minutes on a topic"""
  TOPIC_MINUTES
}

type WeeklyTaskPayload {
  task: WeeklyTask
  userErrors: [UserError!]!
}

type WeeklyTasks {
  """Tasks a week may hold"""
  max: Int!
  tasks: [WeeklyTask!]!

  """The Monday of the person's Rhythm week (YYYY-MM-DD)"""
  weekStart: String!
}

enum YearOfStudy {
  GRADUATED
  NOT_STUDYING
  POSTGRADUATE
  SCHOOL
  YEAR_1
  YEAR_2
  YEAR_3
  YEAR_4
  YEAR_5
}
