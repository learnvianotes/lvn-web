  MODERATION
  NOTES_IMPORT
  QUIZ_PUBLISHED
  REVISION_REMINDER

  """Someone asked the viewer to be Rhythm buddies, or accepted (ADR-0072)"""
  RHYTHM_BUDDY
  SHARE
  STREAK_AT_RISK
  VERIFICATION
}

