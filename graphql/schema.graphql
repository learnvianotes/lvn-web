  deleteAiAnswer(id: UUID!): OkPayload!
  deleteAiArtifact(id: UUID!): OkPayload!

  """Routes through it then use the default connection"""
  deleteAiConnection(input: AiConnectionIdInput!): AiSettingsPayload!
  deleteAiTaskRoute(input: AiTaskRouteInput!): AiSettingsPayload!

  """Staff: moves the quiz to the trash; its attempts stay"""
  deleteClassQuiz(input: ClassQuizIdInput!): OkPayload!
  deleteClassroom(input: ClassroomIdInput!): OkPayload!
  deleteClassroomPost(input: ClassroomPostIdInput!): ClassroomPayload!

  """
  Its author, the note's owner, group moderators or class staff; with replies it stays as removed
  """
  deleteComment(input: CommentIdInput!): CommentPayload!

  """The asker or a moderator"""
  deleteDoubt(input: DoubtIdInput!): GroupPayload!
  deleteExam(input: ExamIdInput!): OkPayload!

  """Its notes and subfolders move up one level"""
